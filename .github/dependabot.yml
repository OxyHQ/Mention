# Dependabot configuration for the Mention monorepo.
#
# This repo uses Bun (`bun.lock`) with npm-style workspaces. Dependabot has no
# native "bun" ecosystem, but the `npm` ecosystem reads `package.json` across
# the workspace, so it works for SURFACING dependency updates here.
#
# What it cannot do is write `bun.lock`, and that is not a cosmetic gap: the
# `Lockfile resolves cleanly from the base` gate resolves the base lockfile
# against the head's manifests and fails on any difference, so a Dependabot PR
# that touches a `package.json` is red the moment it opens and stays red. Nine
# such PRs sat open for weeks before anyone read the gate rather than the
# ecosystem name. Treat a Dependabot npm PR as a NOTIFICATION of an available
# version, not as a mergeable change: adopt the bump on a branch of your own
# with `bun install` and the regenerated `bun.lock` in the same commit, then
# close the Dependabot PR. Only the `github-actions` ecosystem below merges
# as-opened, because it has no lockfile to keep in step.
#
# Deliberately conservative:
#   * The carefully pinned ecosystem packages (@oxyhq/*, expo*, react / react
#     -native, and the metro/expo toolchain) are MANUALLY managed — their
#     versions are coordinated across the whole Oxy ecosystem, so Dependabot is
#     told to ignore them rather than fight the pins.
#   * Everything else is grouped to keep PR volume low.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm / Bun workspaces — root + every package.
  # ---------------------------------------------------------------------------
  # One entry, rooted at the workspace root. Dependabot's npm ecosystem follows
  # the root manifest's `workspaces` globs and edits the child `package.json`
  # that actually declares the dependency, so adding `/packages/*` alongside `/`
  # does not widen coverage — it opens a second, identical PR for every bump
  # (#783/#787, #784/#788, #785/#789, #786/#790 were four such pairs).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Group low-risk updates so we get a small number of consolidated PRs
    # instead of one PR per package.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # MANUALLY managed — do NOT let Dependabot touch the pinned ecosystem.
    # These versions are coordinated across all Oxy apps (Mention, Allo,
    # Homiio, accounts, console, inbox, …) and bumped by hand.
    ignore:
      # Oxy platform SDK — pinned + aligned across the monorepo.
      - dependency-name: "@oxyhq/*"
      # Expo SDK + toolchain — locked to the Expo SDK 56 release train.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      # React / React Native core — version-locked via root `overrides`.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-web"
      # The React Native toolchain packages ship on RN's own release train, so
      # they are only correct at the RN minor this app is on — Dependabot
      # offered `@react-native/jest-preset` and `@react-native/metro-config`
      # 0.87.0 against RN 0.86.
      - dependency-name: "@react-native/*"
      # Pinned to the exact `react` version, never to its own latest: a
      # `react-test-renderer` ahead of `react` renders against a reconciler the
      # app does not ship (offered 19.2.8 against react 19.2.3).
      - dependency-name: "react-test-renderer"
      # Third-party native modules that the Expo SDK itself version-pins. These
      # are named individually rather than as `react-native-*` on purpose: the
      # list below is exactly `packages/frontend`'s dependencies intersected
      # with `expo/bundledNativeModules.json`, and a `react-native-*` wildcard
      # would also freeze react-native-compressor, react-native-css,
      # react-native-nitro-modules, react-native-popup-menu and
      # react-native-qrcode-svg, none of which Expo pins. Bump these with
      # `bunx expo install` at SDK-upgrade time, never one at a time.
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/netinfo"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-keyboard-controller"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-webview"
      # Metro / RN build + animation stack — must move in lockstep with Expo.
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-worklets-core"
      - dependency-name: "nativewind"
      - dependency-name: "tailwindcss"
      - dependency-name: "@tailwindcss/*"
      - dependency-name: "lightningcss"
      - dependency-name: "lightningcss-*"
      # AI SDK — intentionally pinned (breaking changes between minors).
      - dependency-name: "ai"

  # ---------------------------------------------------------------------------
  # GitHub Actions — keep workflow action versions current.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
