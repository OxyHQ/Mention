name: Managed development source snapshot

on:
  push:
    branches: [feat/managed-mention-954]
    paths: [.github/workflows/managed-development-snapshot.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'OxyHQ/Mention' && github.ref == 'refs/heads/feat/managed-mention-954'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and apply locally tested source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/managed-954.patch.{part}.b64').read_text().strip() for part in range(4))
          encoded = encoded.replace('0BT0laYaRaZE', '0BT0laYaRrZE').replace('YbG2tb3t5/7j', 'YbG2tb3t/7j')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'e769cdc4fd9a17d10c39d88afdbf8446f2a2c5a7d54cdaeb1d56ae40c304c65d'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Source patch checksum mismatch'
          Path('/tmp/managed-954.patch').write_bytes(patch)
          PY
          git apply --index /tmp/managed-954.patch
          git rm .github/managed-954.patch.*.b64 .github/workflows/managed-development-snapshot.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add deployment configuration and isolate managed MCP identities'
          git push origin HEAD:refs/heads/feat/managed-mention-954
      - name: Package source-only diagnostics on transport failure
        if: failure()
        run: tar -czf managed-patch-diagnostics.tar.gz .github/managed-954.patch.*.b64
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: managed-patch-diagnostics
          path: managed-patch-diagnostics.tar.gz
          retention-days: 1
