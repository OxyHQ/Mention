name: Managed development source snapshot

on:
  push:
    branches: [feat/managed-mention-954]
    paths: [.github/workflows/managed-development-snapshot.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare verification tooling without application credentials
        run: |
          mkdir -p /tmp/mention-tooling
          cd /tmp/mention-tooling
          printf '%s\n' '{"private":true,"dependencies":{"zod":"4.5.4","typescript":"6.0.3","@types/node":"26.1.1","@types/bun":"1.3.14"}}' > package.json
          bun install --ignore-scripts
          cp "$(command -v bun)" ./bun
          tar -czf "$GITHUB_WORKSPACE/mention-tooling.tar.gz" bun node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: mention-tooling
          path: mention-tooling.tar.gz
          retention-days: 1
          if-no-files-found: error
