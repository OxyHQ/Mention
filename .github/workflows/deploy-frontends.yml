name: Deploy Frontends

on:
  # Two triggers, one release per commit. `release-provenance.sh` in the `scope`
  # job decides which of them owns a given SHA, and the answer is the same from
  # both sides, so exactly one of them deploys it:
  #
  #   * push to main — a commit that came through the merge queue. The queue
  #     tested this exact SHA in a `merge_group` run of CI and only then
  #     fast-forwarded main to it, so the release verifies THAT run's
  #     `CI complete` (by the GitHub API, for this SHA, fail-closed) and starts
  #     at once instead of waiting ~8-10 minutes for CI on push to re-test the
  #     same tree. Every other push is skipped here, with a notice.
  #
  #   * workflow_run of CI — the path every release used to take, kept as the
  #     fallback for commits that did NOT come through the queue (an admin
  #     bypass, a direct push, the window before the queue is switched on). It
  #     still requires CI on push to have succeeded, exactly as before, and it
  #     skips any SHA the push path already owns.
  #
  # Before the merge-queue ruleset is enabled no commit is ever verified, so
  # the push trigger skips everything and releases behave exactly as they did.
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '24.21.0'
  # The commit under release: the pushed head on `push`, the tested head on
  # `workflow_run`. Both are commits on main; require-current-main.sh refuses
  # either the moment it stops being main's head.
  DEPLOY_SHA: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
  # The wrangler every leg runs on — the Pages preview and both Worker legs —
  # pinned to the version the Worker migration was verified against rather than
  # floating on `@4`. The preview leg used to run 4.81.0 inside
  # cloudflare/wrangler-action; it moved here when the action was dropped.
  WRANGLER_VERSION: '4.130.0'

jobs:
  # Decides, before anything is serialised, whether this run releases anything:
  # which path owns the SHA, whether it is still main's head, and whether it
  # changed anything this target ships. It sits OUTSIDE the release concurrency
  # group on purpose — see the deploy job.
  scope:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `actions: read` to look up the SHA's merge_group CI run and its jobs. Job
    # level, so no other job gains it; this job holds nothing else.
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/frontend` marker to the
          # candidate, so this job needs the marker tags and the history that
          # connects them to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Decide which release path owns this commit
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: bash .github/scripts/release-provenance.sh
      # Checked here as well as in the deploy job, and this one is what keeps
      # the release lane ordered: a run whose SHA main has already left never
      # reaches the concurrency group, so it cannot displace a newer release
      # waiting there (GitHub cancels a PENDING run when another queues behind
      # it). Neutral, not red — the newer head's release carries this commit.
      - name: Skip a commit main has already moved past
        id: current
        if: steps.provenance.outputs.release == 'true'
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh
      - name: Detect frontend deployment scope
        id: filter
        if: steps.current.outputs.current == 'true'
        run: bash .github/scripts/deployment-scope.sh frontend

  deploy-frontend:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    # On THIS job, not the workflow, since the workflow gained a second trigger.
    # Every commit now starts two runs of it (push, then CI's workflow_run ~10
    # minutes later), and one of the two always releases nothing. A
    # workflow-level group would queue the no-op beside real releases, and
    # GitHub cancels a pending run when another queues behind it — so a no-op
    # for an older commit could silently displace a pending release of a newer
    # one. Here only a run that `scope` has already judged current and owned
    # ever enters the lane.
    concurrency:
      group: deploy-mention-frontend
      # Serialize production promotions; a cancelled promotion can leave the Worker
      # between the preview gate and its production smoke.
      cancel-in-progress: false
    outputs:
      # 'true' only when the LAST stale-release guard passed, i.e. this job went
      # on to change production. A job that stopped at a stale guard still
      # succeeds (neutral), so success alone must not move the marker.
      released: ${{ steps.current_release.outputs.current }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        id: current_build
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.current_build.outputs.current == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install exact dependency graph
        if: steps.current_build.outputs.current == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build shared runtime package
        if: steps.current_build.outputs.current == 'true'
        run: bun run build:shared-types

      - name: Build frontend
        if: steps.current_build.outputs.current == 'true'
        run: bun run build:frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mention.earth
          # Mention's PRODUCTION Oxy client id. `packages/frontend/config.ts`
          # falls back to a committed id when this is unset, so a local build
          # runs unconfigured — which is why it must be injected here: without
          # it the deployed bundle authenticates against the wrong Oxy
          # application, with nothing empty and nothing erroring. A repo
          # VARIABLE, not a secret: the id ships inside the bundle, so it is
          # public by construction and a secret would only hide it from the UI.
          # The backend's MENTION_OXY_CLIENT_ID stays a secret because it rides
          # the SSM sync pipeline in deploy-aws.yml, which is built for secrets.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}

      - name: Validate static hosting contract
        if: steps.current_build.outputs.current == 'true'
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/frontend/dist

      - name: Verify current main before production changes
        id: current_changes
        if: steps.current_build.outputs.current == 'true'
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh

      # `bunx wrangler`, NOT `cloudflare/wrangler-action` (forbidden fleet-wide).
      # The action installs its own wrangler mid-deploy, and that install
      # intermittently dies with `Fail extracting tarball for "wrangler"` and
      # publishes nothing. Same pinned wrangler as the Worker legs below.
      #
      # The smoke and browser gates read `steps.preview.outputs.deployment-url`,
      # which the action used to set. wrangler writes the same value itself:
      # with WRANGLER_OUTPUT_FILE_PATH set it appends a `pages-deploy-detailed`
      # ND-JSON entry whose `url` is this exact deployment — the entry the
      # action read. An empty URL fails here rather than smoking nothing.
      - name: Deploy an immutable Cloudflare Pages preview
        if: steps.current_changes.outputs.current == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          WRANGLER_OUTPUT_FILE_PATH="$output_file" \
            bunx "wrangler@$WRANGLER_VERSION" pages deploy packages/frontend/dist \
            --project-name=mention-frontend --branch="candidate-$DEPLOY_SHA"
          url="$(jq -r 'select(.type == "pages-deploy-detailed") | .url // empty' "$output_file" | tail -n 1)"
          if [[ -z "$url" ]]; then
            echo "::error::wrangler reported no Pages deployment URL; the preview gates would have nothing to test."
            exit 1
          fi
          echo "deployment-url=$url" >>"$GITHUB_OUTPUT"

      - name: Smoke test the exact preview deployment
        if: steps.current_changes.outputs.current == 'true'
        env:
          WEB_ORIGIN: ${{ steps.preview.outputs.deployment-url }}
        run: bash .github/scripts/smoke-frontend.sh

      # The curl smoke above proves the deployment answers and caches correctly.
      # It cannot prove the app BOOTS: provider-ordering crashes, suspense
      # deadlocks that never commit the root, and stale route chunks all serve a
      # perfectly healthy 200. AGENTS.md says repeatedly that those only show up
      # in a real foregrounded browser and that jest and tsc do not catch them —
      # this is that check, run against the exact preview deployment while it is
      # still cheap to abandon. A failure here fails the job before the promotion
      # step below, so production is never touched.
      - name: Set up the pinned Node runtime for the browser gate
        if: steps.current_changes.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the Chromium build the browser gate drives
        if: steps.current_changes.outputs.current == 'true'
        run: bun run --cwd packages/e2e install-browser

      - name: Gate the candidate build in a real browser
        if: steps.current_changes.outputs.current == 'true'
        env:
          MENTION_E2E_CANDIDATE_ORIGIN: ${{ steps.preview.outputs.deployment-url }}
        run: bun run --cwd packages/e2e test

      - name: Upload the browser gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mention-e2e-report-${{ env.DEPLOY_SHA }}
          path: packages/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Re-verify current main before production promotion
        id: current_release
        if: steps.current_changes.outputs.current == 'true'
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh

      # The same export is intentionally tested as a Pages preview first. Its
      # SPA rewrite is valid there, but Workers owns the fallback through
      # `assets.not_found_handling` and rejects the Pages rewrite as a loop.
      # Remove exactly that target-specific control file only after the preview
      # and browser gates have passed; application assets remain byte-identical.
      - name: Prepare the validated output for Workers Assets
        if: steps.current_release.outputs.current == 'true'
        run: |
          set -euo pipefail
          test -f packages/frontend/dist/_redirects
          rm packages/frontend/dist/_redirects
          test ! -e packages/frontend/dist/_redirects

      # A WORKER, not a Pages project — and for Mention that is not a tidiness
      # change. A Pages project ALWAYS serves `<project>.pages.dev` with no way to
      # switch it off, and here that duplicate was load bearing:
      # `mention-frontend.pages.dev` was the origin `apexFrontendProxy` fetched
      # the app from, so the same bytes were served to anyone who found the name,
      # in no CORS allowlist — a shell that booted and then failed every call.
      # `workers_dev = false` plus the access gate in
      # `packages/frontend/worker/index.js` leaves `shell.mention.earth` as the
      # only name, and it answers 403 to everyone but this backend.
      #
      # RUN THROUGH `bunx`, NOT `cloudflare/wrangler-action`, like the preview
      # leg above. For this leg there is a second reason: the action resolves its
      # own wrangler by looking for a lockfile in `workingDirectory`, and
      # `packages/frontend` has none — the lockfile is at the repository root —
      # so it falls back to npm. That is the exact fallback that failed five
      # consecutive Alia runs.
      #
      # `--secrets-file` uploads the access key IN THE SAME operation as the code,
      # so no deployed version ever exists without it, and it is additive: secrets
      # absent from the file are left alone rather than deleted. Written with `jq`
      # rather than `printf` so a key containing `#`, a quote or whitespace cannot
      # be mangled by .env parsing.
      - name: Promote the validated assets to the shell Worker
        if: steps.current_release.outputs.current == 'true'
        id: production
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MENTION_SHELL_ACCESS_KEY: ${{ secrets.MENTION_SHELL_ACCESS_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          if [[ -z "$MENTION_SHELL_ACCESS_KEY" ]]; then
            echo "::error::MENTION_SHELL_ACCESS_KEY is empty. The Worker would deploy without its access key and answer 503 to every backend request."
            exit 1
          fi
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg key "$MENTION_SHELL_ACCESS_KEY" '{SHELL_ACCESS_KEY: $key}' >"$secrets_file"
          bunx "wrangler@$WRANGLER_VERSION" deploy --secrets-file "$secrets_file"

      # The Worker has no per-deployment URL to smoke the way a Pages preview
      # does: `wrangler deploy` replaces what `shell.mention.earth` serves, in one
      # step, so the custom domain IS the exact deployment. The key is what makes
      # this a test of the app rather than a test of the 403 page.
      - name: Smoke test the exact production deployment
        if: steps.current_release.outputs.current == 'true'
        id: production_smoke
        env:
          WEB_ORIGIN: https://shell.mention.earth
          WEB_SHELL_ACCESS_KEY: ${{ secrets.MENTION_SHELL_ACCESS_KEY }}
        run: bash .github/scripts/smoke-frontend.sh

      # The gate that proves the lock is a lock. Everything above authenticates,
      # so nothing above would notice if the Worker started serving the app to
      # anyone — which is the single defect this whole migration exists to remove,
      # and the one a future `run_worker_first` regression would silently restore.
      - name: The shell Worker refuses an unauthenticated caller
        if: steps.current_release.outputs.current == 'true'
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --retry 5 --retry-delay 5 \
            --retry-all-errors --max-redirs 0 --output /dev/null --write-out '%{http_code}' \
            https://shell.mention.earth/)"
          if [[ "$code" != "403" ]]; then
            echo "::error::shell.mention.earth answered HTTP $code without a key (expected 403). The app is publicly readable at a second origin."
            exit 1
          fi
          echo "shell.mention.earth refuses an unauthenticated caller."

      - name: Smoke test the apex after the backend rollout
        if: steps.current_release.outputs.current == 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if WEB_ORIGIN="https://mention.earth" bash .github/scripts/smoke-frontend.sh; then
              exit 0
            fi
            if [[ "$attempt" -eq 40 ]]; then
              echo "::error::Apex integration did not converge after 10 minutes."
              exit 1
            fi
            echo "::warning::Apex still serves the previous backend contract; retrying in 15 seconds."
            sleep 15
          done

      # `wrangler rollback` with no version id targets the Worker's PREVIOUS
      # deployment, so unlike the Pages path this needs nothing captured before
      # the deploy — the version history is the record. `--yes` is required: it
      # prompts for confirmation otherwise and would hang the job until the
      # runner killed it.
      #
      # The condition is unchanged in intent and the `production_smoke` clause is
      # the load-bearing half: the apex smoke below it races a backend rollout, and
      # an apex/backend race must never roll back a shell that was just proved good.
      - name: Roll back the shell Worker after a failed production smoke
        if: >-
          failure() &&
          steps.production.outcome == 'success' &&
          steps.production_smoke.outcome == 'failure'
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          bunx "wrangler@$WRANGLER_VERSION" rollback --yes \
            --message "Production smoke failed for $DEPLOY_SHA"
          echo "::warning::Rolled the shell Worker back to its previous version."

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff — and only when that
    # rollout actually happened. A deploy job that met a stale guard ends green
    # having changed nothing; moving the marker to its SHA would drop every
    # change between production and that SHA out of the next scope diff.
    needs: deploy-frontend
    if: needs.deploy-frontend.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the build job
    # keeps a read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed frontend revision
        run: bash .github/scripts/record-deployment.sh frontend
