name: Deploy Frontends

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-mention-frontend
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2
      - name: Detect frontend deployment scope
        id: filter
        run: bash .github/scripts/deployment-scope.sh frontend

  deploy-frontend:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build shared runtime package
        run: bun run build:shared-types

      - name: Build frontend
        run: bun run build:frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mention.earth

      - name: Validate static hosting contract
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/frontend/dist

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      - name: Capture the current production deployment
        id: previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mention-frontend/deployments?env=production&per_page=1")"
          deployment_id="$(jq -r '.result[0].id // empty' <<<"$response")"
          if [[ -z "$deployment_id" ]]; then
            echo "::error::Cloudflare returned no current production deployment."
            exit 1
          fi
          echo "deployment_id=$deployment_id" >>"$GITHUB_OUTPUT"

      - name: Deploy an immutable Cloudflare Pages preview
        id: preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: '4.81.0'
          command: pages deploy packages/frontend/dist --project-name=mention-frontend --branch=candidate-${{ env.DEPLOY_SHA }}

      - name: Smoke test the exact preview deployment
        env:
          WEB_ORIGIN: ${{ steps.preview.outputs.deployment-url }}
        run: bash .github/scripts/smoke-frontend.sh

      - name: Re-verify current main before production promotion
        run: bash .github/scripts/require-current-main.sh

      - name: Promote the validated assets to Cloudflare Pages production
        id: production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: '4.81.0'
          command: pages deploy packages/frontend/dist --project-name=mention-frontend --branch=main

      - name: Smoke test the exact production deployment
        id: production_smoke
        env:
          DEPLOYMENT_ORIGIN: ${{ steps.production.outputs.deployment-url }}
        run: WEB_ORIGIN="$DEPLOYMENT_ORIGIN" bash .github/scripts/smoke-frontend.sh

      - name: Smoke test the apex after the backend rollout
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if WEB_ORIGIN="https://mention.earth" bash .github/scripts/smoke-frontend.sh; then
              exit 0
            fi
            if [[ "$attempt" -eq 40 ]]; then
              echo "::error::Apex integration did not converge after 10 minutes."
              exit 1
            fi
            echo "::warning::Apex still serves the previous backend contract; retrying in 15 seconds."
            sleep 15
          done

      - name: Roll back Cloudflare Pages after a failed production smoke
        if: >-
          failure() &&
          steps.production.outcome == 'success' &&
          steps.production_smoke.outcome == 'failure' &&
          steps.previous.outputs.deployment_id != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/mention-frontend/deployments/$PREVIOUS_DEPLOYMENT_ID/rollback" \
            >/dev/null
          echo "::warning::Cloudflare Pages rolled back to $PREVIOUS_DEPLOYMENT_ID."
