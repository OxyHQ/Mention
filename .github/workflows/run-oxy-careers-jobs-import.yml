name: Run the Oxy careers jobs import

# ONE-SHOT: publish Oxy's 21 recovered careers listings as Mention-owned jobs
# under the Oxy organization account, and mirror each one into Clarity.
#
# The content was recovered from `oxy.so/company/careers`'s prerendered
# JobPosting JSON-LD after the website moved to reading Clarity Jobs
# (OxyHQ/website#113); it ships as a committed fixture beside the script
# (`packages/backend/src/scripts/fixtures/oxyCareersJobs.json`). The script is
# `packages/backend/src/scripts/importOxyCareersJobs.ts` and its docblock is the
# authority on what it does. Manual only.
#
# WHY IT IS SHAPED LIKE THIS (the same two constraints as every other one-shot
# in this directory, and the reason they are all copies of each other):
#
# 1. The database is on a PRIVATE VPC address, unreachable from a GitHub runner,
#    so the script has to run as an ECS task INSIDE the VPC ("Fargate one-shot").
#
# 2. It can only run code from `main`. The task reuses the live service's runtime
#    role, secrets, subnets and security groups, so allowing an arbitrary ref
#    here would turn a branch workflow into production code execution.
#
# The import is IDEMPOTENT on (employer, normalized title): a second run matches
# every job the first created and writes nothing. That is what makes re-running
# it after a partial failure safe, and it is covered by
# `src/__tests__/scripts/importOxyCareersJobs.test.ts`.
#
# ALWAYS run dry FIRST (`dry_run=true`, the default). A dry run resolves every
# GeoNames place id against Clarity's gazetteer and checks it against the
# locality the original listing stated — so the preview is also what VERIFIES
# the places — parses every entry against the same contract the HTTP create
# route uses, and prints the per-listing plan (create / republish / skip)
# without writing anything. Read the plan, then re-run with dry_run=false.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD be published, write nothing'
        required: true
        type: boolean
        default: true
      confirm_write:
        description: 'For a real write, enter: IMPORT OXY CAREERS JOBS'
        required: false
        type: string

concurrency:
  # Two concurrent imports would both read an empty employer and both insert.
  group: import-oxy-careers-jobs
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: mention
  CLUSTER: oxy-cluster
  SERVICE: mention
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the import image (its own tag; never `latest`)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}:import-oxycareers-${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final import runtime image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
          EXPECTED_RUNTIME_COMMANDS: 'bun,busybox'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Re-verify current main before the production one-shot
        run: bash .github/scripts/require-current-main.sh

      - name: Run the import as an ECS one-shot task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
        run: |
          set -euo pipefail
          MAX_WAIT_SECS=1800
          POLL_INTERVAL=15
          IMPORT_TASK_DEF=""
          TASK_ARN=""
          TASK_STOPPED=true

          cleanup() {
            local exit_status=$?
            trap - EXIT
            if [[ "$TASK_STOPPED" != "true" && -n "$TASK_ARN" ]]; then
              echo "::warning::Import task $TASK_ARN may still be running; the deploy role cannot call ecs:StopTask. Verify it in ECS."
            fi
            if [[ -n "$IMPORT_TASK_DEF" ]]; then
              aws ecs deregister-task-definition \
                --task-definition "$IMPORT_TASK_DEF" \
                >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          if [[ "$DRY_RUN" != "true" &&
                "$CONFIRM_WRITE" != "IMPORT OXY CAREERS JOBS" ]]; then
            echo "::error::A write run requires the exact confirmation phrase."
            exit 1
          fi

          # Take the task definition and network config from the LIVE service, so
          # the one-shot runs with the same secrets, roles, subnets and security
          # groups the backend already runs with. Nothing is hardcoded, and nothing
          # drifts when the service is redeployed. The Clarity credential and the
          # Oxy service identity the script needs come from exactly there.
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [[ "$(jq -r '.status // "NONE"' <<<"$SERVICE_JSON")" != "ACTIVE" ]]; then
            echo "::error::The production ECS service is not active."
            exit 1
          fi

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot
          # even pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          # A throwaway revision that differs from the live one ONLY by the image.
          # The service keeps running its own revision; this one exists so the task
          # can run a branch image without touching the live service.
          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > import-taskdef.json

          IMPORT_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://import-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "import task definition: $IMPORT_TASK_DEF"

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg dry "$DRY_RUN" \
            '{containerOverrides:[{
               name: $name,
               command: [
                 "busybox","timeout","-s","TERM","-k","30","900",
                 "bun","packages/backend/dist/src/scripts/importOxyCareersJobs.js"
               ],
               environment: [
                 {name:"DRY_RUN", value:$dry},
                 {
                   name:"CONFIRM_ADMIN_MUTATION",
                   value:"importOxyCareersJobs"
                 }
               ]
             }]}')

          RUN_TASK_JSON=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$IMPORT_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
            --overrides "$OVERRIDES" \
            --started-by "gh-import-oxy-careers")

          if [[ "$(jq '.failures | length' <<<"$RUN_TASK_JSON")" != "0" ]]; then
            echo "::error::ECS refused to start the import task."
            jq '.failures' <<<"$RUN_TASK_JSON"
            exit 1
          fi
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_TASK_JSON")
          if [[ -z "$TASK_ARN" ]]; then
            echo "::error::ECS returned no import task ARN."
            exit 1
          fi
          TASK_STOPPED=false

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          ELAPSED=0
          while (( ELAPSED < MAX_WAIT_SECS )); do
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "($ELAPSED s) import task status=$LAST_STATUS"
            if [[ "$LAST_STATUS" == "STOPPED" ]]; then
              TASK_STOPPED=true
              break
            fi
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ "$TASK_STOPPED" != "true" ]]; then
            echo "::error::Import exceeded ${MAX_WAIT_SECS}s. The deploy role cannot call ecs:StopTask; task $TASK_ARN may still be running and must be checked in ECS."
            exit 1
          fi

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── import output ────────"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "───────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # The verdict comes from the exit code, NOT from grepping the log:
          # retrieval above is best-effort, so an unavailable log stream would
          # otherwise read as the comfortable answer.
          case "$EXIT_CODE" in
            0)
              echo "::notice::Import COMPLETE — every listing is published and mirrored to Clarity."
              {
                echo "### Oxy careers import: COMPLETE"
                echo ""
                echo "Mode: \`dry_run=$DRY_RUN\`. The \`[importOxyCareersJobs] complete\` line in the output above"
                echo "carries \`planned\`, \`created\`, \`republished\`, \`skippedPublished\` and \`skippedClosed\`;"
                echo "the \`[importOxyCareersJobs] entry\` lines name each listing's action and Clarity status."
                echo ""
                echo "On a dry run nothing was written — \`created\` is what a real run WOULD insert."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            75)
              # EXIT_INCOMPLETE in importOxyCareersJobs.ts.
              echo "::warning::Import FINISHED with Clarity syncs failed — every job is created and published. Re-running the import will skip the creates."
              {
                echo "### Oxy careers import: PUBLISHED, SOME NOT INDEXED"
                echo ""
                echo "This is **not** a failure, and it must not be treated as one: the jobs are committed and"
                echo "published. What did not take is the one-way mirror into Clarity, which is fail-soft by"
                echo "design — those rows carry \`clarity_sync_status = 'failed'\` and the adapter retries them"
                echo "lazily on the next read of the job."
                echo ""
                echo "The \`claritySyncFailed\` count is on the \`[importOxyCareersJobs] complete\` line above."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            143)
              echo "::warning::Import was stopped at its 900s bound — whatever it created is committed. Re-run; it skips what already exists."
              {
                echo "### Oxy careers import: PARTIAL (hit the time bound)"
                echo ""
                echo "The container's own \`timeout\` stopped the run. Every job it created is committed, and the"
                echo "import keys on (employer, title), so a re-run creates only the listings still missing."
                echo ""
                echo "The summary line never runs on a kill — read the \`[importOxyCareersJobs] entry\` lines above"
                echo "to see how far it got."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Import task exited with $EXIT_CODE — a real failure. Any code other than 0, 75 or 143 (including 'None', meaning the task stopped without reporting one) means the script threw or the task never ran; check ECS."
              {
                echo "### Oxy careers import: FAILED"
                echo ""
                echo "Exit code \`$EXIT_CODE\`. Stopped reason: \`$REASON\`."
                echo ""
                echo "The script refuses the whole run before its first write when a place id cannot be resolved"
                echo "or resolves to the wrong city, so a failure here does **not** imply a half-published set —"
                echo "but confirm against the \`[importOxyCareersJobs] entry\` lines before re-running."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
