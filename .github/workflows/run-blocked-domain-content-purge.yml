name: Purge blocked-domain content from Mention

# The OTHER half of a blocked-domain purge. `run-blocked-domain-purge.yml` asks
# Oxy to remove the federated IDENTITIES and the mirrored media it holds;
# `purgeBlockedDomainContent` removes what MENTION holds — the posts themselves,
# the actor rows, engagement, and our own media cache. Blocking an instance
# stops new content arriving and does nothing about what arrived before, so
# without this the clean is half done in the direction users actually see.
#
# Runs as an ECS Fargate one-shot, same as its sibling and for the same two
# reasons: the database is on a private VPC address, and the task must run code
# from `main` because it reuses the live service's role, secrets and network.
#
# ⚠ THE SAFE DEFAULT IS INVERTED IN THE SCRIPT, WHICH IS WHY THIS FILE GUARDS IT
#   `purgeBlockedDomainContent` reads `DRY_RUN` as TRUE only for "1"/"true"/"yes"
#   and treats EVERYTHING ELSE — including unset, empty, or a mangled value — as
#   a mutating run. That is the opposite of its platform sibling, whose default
#   is a plan. So this workflow refuses to proceed unless `dry_run` is exactly
#   "true" or "false", and passes "1" for a plan rather than relying on the
#   spelling surviving the trip. A value that arrives damaged stops the run
#   instead of deleting.
#
# WHAT GETS DELETED IS DECIDED IN GIT
#   The script sweeps the committed `federationBlockPolicy` unioned with
#   `FEDERATION_BLOCKED_DOMAINS` (currently unset in production). Our own
#   federation, actor and Oxy identity domains are SUBTRACTED explicitly, so an
#   operator cannot blocklist us into deleting local users' content, and an empty
#   target set refuses to run rather than sweeping everything.
#
# LOCAL USERS ARE AFFECTED HERE, UNLIKE THE PLATFORM HALF
#   The removed posts are other people's, but local users interacted with them.
#   The script decides each shape explicitly (a local reply is KEPT with its
#   parent left dangling, and so on) — read its header before a live run, and
#   read the plan's counters, not just its totals.
#
# ALWAYS PLAN FIRST. Start with `purge_domain`, and consider `purge_limit` as a
# canary budget on the first live run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD be deleted, delete nothing'
        required: true
        type: boolean
        default: true
      confirm_write:
        description: 'For a real deletion, enter: PURGE BLOCKED CONTENT'
        required: false
        type: string
      purge_domain:
        description: 'Restrict every phase to ONE domain (must be in the policy). Recommended first.'
        required: false
        type: string
      purge_limit:
        description: 'Cap on actors processed in phase 1 — a canary budget. Blank = no cap.'
        required: false
        type: string
      reset_cursor:
        description: 'Forget recorded progress and start from the top'
        required: false
        type: boolean
        default: false

concurrency:
  # Never let two purges walk the same collections at once.
  group: purge-blocked-domain-content
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: mention
  CLUSTER: oxy-cluster
  SERVICE: mention
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push the purge image (its own tag; never `latest`)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}:purge-blockedcontent-${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final purge runtime image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
          EXPECTED_RUNTIME_COMMANDS: 'bun,busybox'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Re-verify current main before the production one-shot
        run: bash .github/scripts/require-current-main.sh

      - name: Run the content purge as an ECS one-shot task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          PURGE_DOMAIN: ${{ inputs.purge_domain }}
          PURGE_LIMIT: ${{ inputs.purge_limit }}
          RESET_CURSOR: ${{ inputs.reset_cursor }}
        run: |
          set -euo pipefail
          MAX_WAIT_SECS=3600
          POLL_INTERVAL=15
          PURGE_TASK_DEF=""
          TASK_ARN=""
          TASK_STOPPED=true

          cleanup() {
            local exit_status=$?
            trap - EXIT
            if [[ "$TASK_STOPPED" != "true" && -n "$TASK_ARN" ]]; then
              echo "::warning::Purge task $TASK_ARN may still be running; the deploy role cannot call ecs:StopTask. Verify it in ECS."
            fi
            if [[ -n "$PURGE_TASK_DEF" ]]; then
              aws ecs deregister-task-definition \
                --task-definition "$PURGE_TASK_DEF" \
                >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          # The script treats ANY unrecognised DRY_RUN as a mutating run, so a
          # damaged value must stop us here rather than reach it.
          if [[ "$DRY_RUN" != "true" && "$DRY_RUN" != "false" ]]; then
            echo "::error::dry_run must be exactly true or false (got: ${DRY_RUN:-<empty>})."
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" &&
                "$CONFIRM_WRITE" != "PURGE BLOCKED CONTENT" ]]; then
            echo "::error::A deletion run requires the exact confirmation phrase."
            exit 1
          fi

          if [[ -n "$PURGE_LIMIT" ]] && { [[ ! "$PURGE_LIMIT" =~ ^[0-9]+$ ]] || (( PURGE_LIMIT < 1 )); }; then
            echo "::error::purge_limit must be a positive integer, or blank."
            exit 1
          fi

          # A hostname, or empty. Anything else is a typo the script would only
          # reject after the task has already started.
          if [[ -n "$PURGE_DOMAIN" && ! "$PURGE_DOMAIN" =~ ^[a-z0-9.-]+$ ]]; then
            echo "::error::purge_domain must be a bare hostname."
            exit 1
          fi

          # Take the task definition and network config from the LIVE service, so
          # the one-shot runs with the same secrets, roles, subnets and security
          # groups the backend already runs with. Nothing is hardcoded, and nothing
          # drifts when the service is redeployed.
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [[ "$(jq -r '.status // "NONE"' <<<"$SERVICE_JSON")" != "ACTIVE" ]]; then
            echo "::error::The production ECS service is not active."
            exit 1
          fi

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot
          # even pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          # A throwaway revision that differs from the live one ONLY by the image.
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > purge-taskdef.json

          PURGE_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://purge-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "purge task definition: $PURGE_TASK_DEF"

          # "1"/"0" rather than the input's own spelling: this script's reader
          # accepts only "1"/"true"/"yes" as true and everything else is a live
          # run, so the plan path is written in the one token it cannot misread.
          if [[ "$DRY_RUN" == "true" ]]; then SCRIPT_DRY_RUN=1; else SCRIPT_DRY_RUN=0; fi
          if [[ "$RESET_CURSOR" == "true" ]]; then SCRIPT_RESET_CURSOR=1; else SCRIPT_RESET_CURSOR=0; fi

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg dry "$SCRIPT_DRY_RUN" \
            --arg domain "$PURGE_DOMAIN" \
            --arg limit "$PURGE_LIMIT" \
            --arg reset "$SCRIPT_RESET_CURSOR" \
            '{containerOverrides:[{
               name: $name,
               command: [
                 "busybox","timeout","-s","TERM","-k","30","3300",
                 "bun","packages/backend/dist/src/scripts/purgeBlockedDomainContent.js"
               ],
               environment: (
                 [
                   {name:"DRY_RUN", value:$dry},
                   {name:"CONFIRM_ADMIN_MUTATION", value:"purgeBlockedDomainContent"},
                   {name:"RESET_CURSOR", value:$reset}
                 ]
                 # Omitted when blank rather than sent empty: an empty
                 # PURGE_DOMAIN is a domain that is not in the policy, and an
                 # empty PURGE_LIMIT is not "no cap" to every reader.
                 + (if $domain == "" then [] else [{name:"PURGE_DOMAIN", value:$domain}] end)
                 + (if $limit == "" then [] else [{name:"PURGE_LIMIT", value:$limit}] end)
               )
             }]}')

          RUN_TASK_JSON=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$PURGE_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
            --overrides "$OVERRIDES" \
            --started-by "gh-purge-content")

          if [[ "$(jq '.failures | length' <<<"$RUN_TASK_JSON")" != "0" ]]; then
            echo "::error::ECS refused to start the purge task."
            jq '.failures' <<<"$RUN_TASK_JSON"
            exit 1
          fi
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_TASK_JSON")
          if [[ -z "$TASK_ARN" ]]; then
            echo "::error::ECS returned no purge task ARN."
            exit 1
          fi
          TASK_STOPPED=false

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          ELAPSED=0
          while (( ELAPSED < MAX_WAIT_SECS )); do
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "($ELAPSED s) purge task status=$LAST_STATUS"
            if [[ "$LAST_STATUS" == "STOPPED" ]]; then
              TASK_STOPPED=true
              break
            fi
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ "$TASK_STOPPED" != "true" ]]; then
            echo "::error::Purge exceeded ${MAX_WAIT_SECS}s. The deploy role cannot call ecs:StopTask; task $TASK_ARN may still be running and must be checked in ECS."
            exit 1
          fi

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── purge output ────────"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "──────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # A purge whose result you cannot see is a purge you have not run.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Purge task exited with $EXIT_CODE"
            exit 1
          fi
