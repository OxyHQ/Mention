name: CodeQL

# Advanced setup, replacing the repository's default CodeQL setup with the
# same languages, query suite and threat model, on main and weekly but not on
# pull requests. Default setup scanned every pull request push: 2026-10-15..17
# that was 62 runs, ~300 runner minutes of the 20 Actions jobs this org shares
# across every repo. No ruleset blocks a merge on code scanning, so the scan on
# main raises the same alerts, one merge later.
#
# Default setup must be switched off (Settings -> Code security -> CodeQL) once
# this lands; GitHub refuses advanced-setup uploads while it is on.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit's alerts matter, and this is no release trigger.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
