name: Refresh image cache

# Weekly, rebuild each production image with NO cache and write the fresh layers
# into the GitHub Actions cache scope its deploy reads (deploy-aws.yml,
# deploy-mcp-aws.yml and the merge queue's image smoke), so the deploys' cached
# layers stop pinning an old `apt-get`/`apk` result and pick up OS security
# patches. Builds only: no AWS credentials, no push, no deploy. It runs on main
# (schedule or a dispatch from main) and writes main's cache.
# OxyHQ/oxy .github/workflows/refresh-app-image-cache.yml.

on:
  schedule:
    # Mondays 04:47 UTC: off the hour, and off oxy's slot (04:17).
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-image-cache
  cancel-in-progress: false

jobs:
  rebuild:
    permissions:
      contents: read
    uses: OxyHQ/oxy/.github/workflows/refresh-app-image-cache.yml@main
    with:
      targets: >-
        [
          {"name": "backend", "dockerfile": "packages/backend/Dockerfile", "scope": "mention-backend"},
          {"name": "mcp", "dockerfile": "packages/mcp/Dockerfile", "scope": "mention-mcp"}
        ]
