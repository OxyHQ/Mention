# Weekly: rebuild the backend and MCP production images from scratch, into
# the cache.
#
# The deploys' builds read the `type=gha` cache scopes `mention-backend` and
# `mention-mcp`. A cached
# layer is reused for as long as its inputs do not change, and the inputs of an
# OS-package layer (`apt-get update`, `apk upgrade`) are the command text and
# the base image, not the package index: once cached, such a layer never picks
# up a security fix again. Nor does a base image named by tag unless something
# pulls it.
#
# So once a week this rebuilds with `no-cache` and `pull` and writes every
# fresh layer to the same scopes. It runs on main (the default branch), whose
# caches every later production build can read. The images are
# built and discarded (`type=cacheonly`): nothing is pushed, nothing is
# deployed, and the job holds no AWS credentials. The next release picks the
# fresh layers up through the cache.
name: Refresh image cache

on:
  schedule:
    # Mondays 04:47 UTC: off the hour, and off oxy's slot (04:17).
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-image-cache
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild ${{ matrix.target }} without cache
    # Only main's cache is readable by the deploys and the merge queue.
    if: github.ref == 'refs/heads/main' && github.repository == 'OxyHQ/Mention'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One at a time: this is maintenance, and the org shares 20 runners.
      max-parallel: 1
      matrix:
        include:
          - target: backend
            dockerfile: packages/backend/Dockerfile
            cache_scope: mention-backend
          - target: mcp
            dockerfile: packages/mcp/Dockerfile
            cache_scope: mention-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Rebuild (linux/arm64, no cache) into the shared cache scope
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: false
          outputs: type=cacheonly
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
