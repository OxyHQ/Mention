name: Run quoted-posts link + promote backfill

# One-shot backfill that LINKS federated quotes stored without their link, and
# PROMOTES the posts that were withheld for want of one.
#
# Ingest now withholds a post whose declared quote it could not produce
# (`status: 'incomplete'`) rather than publishing it with the remote server's
# `RE: <url>` fallback showing. That is only defensible because it is
# reversible, and this is what reverses it: the statement that links a quote
# returns the post to `published` in the same write.
#
# It is also the repair for rows written before either existed.
#
# WHY IT IS SHAPED LIKE ITS SIBLINGS (`run-federated-text-backfill.yml`,
# `run-federated-author-backfill.yml`):
#
# 1. The database is on a PRIVATE VPC address, unreachable from a GitHub runner,
#    so the script has to run as an ECS task INSIDE the VPC ("Fargate one-shot").
#
# 2. It can only run code from `main`. The task reuses the live service's runtime
#    role, secrets, subnets and security groups, so allowing an arbitrary ref
#    here would turn a branch workflow into production code execution.
#
# THE TASK IS GIVEN MORE MEMORY THAN THE SERVICE, and that is measured rather
# than precautionary. The siblings register a revision that differs from the live
# one only by the image, inheriting 512 CPU / 1024 MB — which is right for a web
# process and not for this. A live run does not merely link: for every quote
# target it does not hold it IMPORTS the quoted post, pulling that post's media
# and its author's avatar through the shared Oxy media store, eight at a time.
# At 1 GB that was killed by the OOM killer (exit 137) twice, once at
# BACKFILL_MAX=20000 and again at 1000. At 4 GB the same work completed in 17
# minutes. CPU is left alone: the account's Fargate vCPU quota is 30 and the
# fleet sits near it, so this asks for memory and not for a share of that.
#
# ALWAYS run dry FIRST (`dry_run=true`, the default). A dry run resolves only
# against posts already held and imports nothing, so its `linked` count
# UNDERSTATES what a live run will do — `notHeldLocally` is the difference.
#
# AUTHORIZATION is the `confirm_write` string plus main-only dispatch, matching
# `run-federated-text-backfill.yml` rather than the dedicated operator allowlist
# `run-federated-author-backfill.yml` carries. That workflow needs one because it
# DELETES rows and mints identities in a different service (Oxy); this one links
# a column, flips a status and imports remote notes through the same signed,
# SSRF-safe path ingest already uses. If it ever grows a delete, it needs the
# allowlist too.
#
# `max` bounds the candidates a single run takes. The script is idempotent and a
# linked post drops out of the candidate set, so successive runs make progress;
# stop when a run reports `written: 0`.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD change, write nothing'
        required: true
        type: boolean
        default: true
      confirm_write:
        description: 'For a real write, enter: LINK QUOTED POSTS'
        required: false
        type: string
      max:
        description: 'Candidates this run may take (idempotent; re-run until written is 0)'
        required: false
        type: string
        default: '5000'

concurrency:
  # Never let two backfills touch the collection at once.
  group: quoted-posts-backfill
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: mention
  CLUSTER: oxy-cluster
  SERVICE: mention
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push the backfill image (its own tag; never `latest`)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}:backfill-quotes-${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final backfill runtime image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
          EXPECTED_RUNTIME_COMMANDS: 'bun,busybox'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Re-verify current main before the production one-shot
        run: bash .github/scripts/require-current-main.sh

      - name: Run the backfill as an ECS one-shot task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          BACKFILL_MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail
          MAX_WAIT_SECS=3600
          POLL_INTERVAL=15
          BACKFILL_TASK_DEF=""
          TASK_ARN=""
          TASK_STOPPED=true

          cleanup() {
            local exit_status=$?
            trap - EXIT
            if [[ "$TASK_STOPPED" != "true" && -n "$TASK_ARN" ]]; then
              echo "::warning::Backfill task $TASK_ARN may still be running; the deploy role cannot call ecs:StopTask. Verify it in ECS."
            fi
            if [[ -n "$BACKFILL_TASK_DEF" ]]; then
              aws ecs deregister-task-definition \
                --task-definition "$BACKFILL_TASK_DEF" \
                >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          if [[ "$DRY_RUN" != "true" &&
                "$CONFIRM_WRITE" != "LINK QUOTED POSTS" ]]; then
            echo "::error::A write run requires the exact confirmation phrase."
            exit 1
          fi

          # Take the task definition and network config from the LIVE service, so
          # the one-shot runs with the same secrets, roles, subnets and security
          # groups the backend already runs with. Nothing is hardcoded, and nothing
          # drifts when the service is redeployed.
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [[ "$(jq -r '.status // "NONE"' <<<"$SERVICE_JSON")" != "ACTIVE" ]]; then
            echo "::error::The production ECS service is not active."
            exit 1
          fi

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot
          # even pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          # A throwaway revision that differs from the live one ONLY by the image.
          # The service keeps running its own revision; this one exists so the task
          # can run a branch image without touching the live service.
          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          # Image AND memory. The siblings change only the image and inherit the
          # service's 1 GB, which the OOM killer ended twice for this workload
          # (see the header). 4096 MB is the smallest Fargate pairing above it
          # that keeps CPU at 512, so this costs no extra vCPU quota.
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | .memory = "4096"
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > backfill-taskdef.json

          BACKFILL_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://backfill-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "backfill task definition: $BACKFILL_TASK_DEF"

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg dry "$DRY_RUN" \
            --arg max "${BACKFILL_MAX:-5000}" \
            '{containerOverrides:[{
               name: $name,
               command: [
                 "busybox","timeout","-s","TERM","-k","30","3300",
                 "bun","packages/backend/dist/src/scripts/backfillQuotedPosts.js"
               ],
               environment: [
                 {name:"BACKFILL_DRY_RUN", value:$dry},
                 {name:"BACKFILL_MAX", value:$max},
                 {
                   name:"CONFIRM_ADMIN_MUTATION",
                   value:"backfillQuotedPosts"
                 }
               ]
             }]}')

          RUN_TASK_JSON=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$BACKFILL_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
            --overrides "$OVERRIDES" \
            --started-by "gh-backfill-quotes")

          if [[ "$(jq '.failures | length' <<<"$RUN_TASK_JSON")" != "0" ]]; then
            echo "::error::ECS refused to start the backfill task."
            jq '.failures' <<<"$RUN_TASK_JSON"
            exit 1
          fi
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_TASK_JSON")
          if [[ -z "$TASK_ARN" ]]; then
            echo "::error::ECS returned no backfill task ARN."
            exit 1
          fi
          TASK_STOPPED=false

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          ELAPSED=0
          while (( ELAPSED < MAX_WAIT_SECS )); do
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "($ELAPSED s) backfill task status=$LAST_STATUS"
            if [[ "$LAST_STATUS" == "STOPPED" ]]; then
              TASK_STOPPED=true
              break
            fi
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ "$TASK_STOPPED" != "true" ]]; then
            echo "::error::Backfill exceeded ${MAX_WAIT_SECS}s. The deploy role cannot call ecs:StopTask; task $TASK_ARN may still be running and must be checked in ECS."
            exit 1
          fi

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── backfill output ────────"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "─────────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # A backfill whose result you cannot see is a backfill you have not run.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Backfill task exited with $EXIT_CODE"
            exit 1
          fi
