name: Run account erasure (one Oxy account, by hand)

# Erases everything Mention holds for ONE Oxy account that was deleted in Oxy
# before the account-event webhook existed (OxyHQ/Mention#1169). Accounts deleted
# after that arrive on their own, by webhook or by the reconciliation sweep; this
# workflow is not the normal path. `docs/account-erasure.md` has the runbook.
#
# It runs `packages/backend/src/scripts/eraseOxyAccount.ts`, which records an
# `operator:<oxy user id>` row in `account_erasures` and runs the SAME erasure an
# Oxy event runs. A re-run resumes that row.
#
# WHY IT IS SHAPED LIKE ITS SIBLINGS (`run-quoted-posts-backfill.yml`):
# the database is on a private VPC address, so the script runs as an ECS one-shot
# inside the VPC, reusing the live service's task definition; and it runs code
# from `main` only.
#
# AUTHORIZATION
#   Dispatches are accepted only from an actor named in the repository variable
#   `ACCOUNT_ERASURE_OPERATORS` (comma-separated GitHub logins). This workflow
#   DELETES a person's data irreversibly, and Actions dispatch access is broader
#   than that. A dedicated variable, for the reason `run-federated-author-backfill.yml`
#   gives: a variable's name is all an admin editing it can read.
#   The check is a STEP that fails, so an unset variable is a red run that names
#   the variable, not a silently skipped job.
#
# SAFETY, in the script itself:
#   - `dry_run` (the default) prints per-category counts and writes nothing.
#   - A live run needs the confirmation phrase below AND the script refuses an
#     account Oxy still resolves as active.

on:
  workflow_dispatch:
    inputs:
      oxy_user_id:
        description: 'The deleted Oxy account id to erase'
        required: true
        type: string
      username:
        description: 'Its handle at deletion time, if known (lets Mention send the fediverse Deletes)'
        required: false
        type: string
      dry_run:
        description: 'Report what WOULD be erased, write nothing'
        required: true
        type: boolean
        default: true
      confirm_write:
        description: 'For a real erasure, enter: ERASE ACCOUNT'
        required: false
        type: string

concurrency:
  group: account-erasure
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: mention
  CLUSTER: oxy-cluster
  SERVICE: mention
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  erase:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.triggering_actor == github.actor
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      # First, before the checkout and before any credential is requested.
      - name: Authorize the dispatcher
        env:
          OPERATORS: ${{ vars.ACCOUNT_ERASURE_OPERATORS }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OPERATORS_NORM="${OPERATORS//[[:space:]]/}"
          if [[ -z "$OPERATORS_NORM" ]]; then
            echo "::error::The repository variable ACCOUNT_ERASURE_OPERATORS is unset or empty, so this workflow authorizes nobody. A repository admin sets it to a comma-separated list of GitHub logins."
            exit 1
          fi
          if [[ ",${OPERATORS_NORM}," != *",${ACTOR},"* ]]; then
            echo "::error::${ACTOR} is not listed in ACCOUNT_ERASURE_OPERATORS."
            exit 1
          fi
          echo "authorized dispatcher: ${ACTOR}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the erasure image (its own tag; never `latest`)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}:account-erasure-${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final erasure runtime image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
          EXPECTED_RUNTIME_COMMANDS: 'bun,busybox'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Re-verify current main before the production one-shot
        run: bash .github/scripts/require-current-main.sh

      - name: Run the erasure as an ECS one-shot task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
          ERASE_OXY_USER_ID: ${{ inputs.oxy_user_id }}
          ERASE_USERNAME: ${{ inputs.username }}
        run: |
          set -euo pipefail
          MAX_WAIT_SECS=3600
          POLL_INTERVAL=15
          ERASURE_TASK_DEF=""
          TASK_ARN=""
          TASK_STOPPED=true

          cleanup() {
            local exit_status=$?
            trap - EXIT
            if [[ "$TASK_STOPPED" != "true" && -n "$TASK_ARN" ]]; then
              echo "::warning::Erasure task $TASK_ARN may still be running; the deploy role cannot call ecs:StopTask. Verify it in ECS."
            fi
            if [[ -n "$ERASURE_TASK_DEF" ]]; then
              aws ecs deregister-task-definition \
                --task-definition "$ERASURE_TASK_DEF" \
                >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          if [[ "$DRY_RUN" != "true" &&
                "$CONFIRM_WRITE" != "ERASE ACCOUNT" ]]; then
            echo "::error::A live erasure requires the exact confirmation phrase."
            exit 1
          fi
          # A plain id only: it is passed into the task's environment.
          if [[ ! "$ERASE_OXY_USER_ID" =~ ^[A-Za-z0-9-]{8,64}$ ]]; then
            echo "::error::oxy_user_id must be a bare Oxy account id."
            exit 1
          fi
          if [[ -n "$ERASE_USERNAME" && ! "$ERASE_USERNAME" =~ ^[A-Za-z0-9_.-]{1,64}$ ]]; then
            echo "::error::username must be a plain handle."
            exit 1
          fi

          # Take the task definition and network config from the LIVE service, so
          # the one-shot runs with the same secrets, roles, subnets and security
          # groups the backend already runs with. Nothing is hardcoded, and nothing
          # drifts when the service is redeployed.
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [[ "$(jq -r '.status // "NONE"' <<<"$SERVICE_JSON")" != "ACTIVE" ]]; then
            echo "::error::The production ECS service is not active."
            exit 1
          fi

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot
          # even pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          # A throwaway revision that differs from the live one ONLY by the image.
          # The service keeps running its own revision; this one exists so the task
          # can run a branch image without touching the live service.
          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          # Image only: the erasure is database-bound and streams in batches, so
          # the service's own memory is enough.
          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > erasure-taskdef.json

          ERASURE_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://erasure-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "erasure task definition: $ERASURE_TASK_DEF"

          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg dry "$DRY_RUN" \
            --arg user "$ERASE_OXY_USER_ID" \
            --arg handle "${ERASE_USERNAME:-}" \
            '{containerOverrides:[{
               name: $name,
               command: [
                 "busybox","timeout","-s","TERM","-k","30","3300",
                 "bun","packages/backend/dist/src/scripts/eraseOxyAccount.js"
               ],
               environment: [
                 {name:"ERASE_DRY_RUN", value:$dry},
                 {name:"ERASE_OXY_USER_ID", value:$user},
                 {name:"ERASE_USERNAME", value:$handle},
                 {
                   name:"CONFIRM_ADMIN_MUTATION",
                   value:(if $dry == "true" then "" else "eraseOxyAccount" end)
                 }
               ]
             }]}')

          RUN_TASK_JSON=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$ERASURE_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
            --overrides "$OVERRIDES" \
            --started-by "gh-account-erasure")

          if [[ "$(jq '.failures | length' <<<"$RUN_TASK_JSON")" != "0" ]]; then
            echo "::error::ECS refused to start the erasure task."
            jq '.failures' <<<"$RUN_TASK_JSON"
            exit 1
          fi
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_TASK_JSON")
          if [[ -z "$TASK_ARN" ]]; then
            echo "::error::ECS returned no erasure task ARN."
            exit 1
          fi
          TASK_STOPPED=false

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          ELAPSED=0
          while (( ELAPSED < MAX_WAIT_SECS )); do
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "($ELAPSED s) erasure task status=$LAST_STATUS"
            if [[ "$LAST_STATUS" == "STOPPED" ]]; then
              TASK_STOPPED=true
              break
            fi
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ "$TASK_STOPPED" != "true" ]]; then
            echo "::error::Erasure exceeded ${MAX_WAIT_SECS}s. The deploy role cannot call ecs:StopTask; task $TASK_ARN may still be running and must be checked in ECS."
            exit 1
          fi

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── erasure output ────────"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "─────────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # A erasure whose result you cannot see is a erasure you have not run.
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Erasure task exited with $EXIT_CODE"
            exit 1
          fi
