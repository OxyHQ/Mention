name: Run GIF library migration

# Drives `migrateGifLibraryToApplicationFiles` — the one-shot that moves the GIF
# library out of Oxy's federation media cache into files the Mention
# APPLICATION owns (ADR 0043, docs/oxy-files.md).
#
# WHY IT EXISTS. Before ADR 0043 an application could own no file, so every GIF
# was uploaded into the platform's evictable federation cache and kept only by
# the convention that Mention never evicted one. New imports already write
# application files; this moves the rows written before (`gifs.storage =
# 'federation_cache'`), rewrites every post naming an old file, and deletes the
# old cache files nothing uses any more. Needs the Oxy API with ADR 0043 stage 3
# deployed and the scopes `files:app:write` + `files:references:write` granted
# to the Mention application.
#
# Shaped like `run-post-hashtags-backfill.yml`, for the same reasons: IN-VPC (the
# database is private) and FROM `main` ONLY (the task reuses the live service's
# role and secrets).
#
# AUTHORIZATION
#   Dispatches are accepted only from an actor named in the repository variable
#   `GIF_LIBRARY_MIGRATION_OPERATORS` (comma-separated).
#
# WHAT IT WRITES. Per GIF, one transaction: the row's file ids and storage, every
# post media / variant media / alt text / attachment naming an old id, and a
# `gif_cache_file_retirements` row per old file. Then the old cache files are
# deleted in Oxy. Idempotent and resumable; a failed GIF or file is left for the
# next run and fails this one.
#
#   dry_run=true (the default) → reads only: how many GIFs would move, how many
#     post media rows would be rewritten, how many old files are owed a delete.
#   dry_run=false → moves, and requires the exact confirmation phrase.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD change, write nothing'
        required: true
        type: boolean
        default: true
      confirm_write:
        description: 'For a real write, enter: MOVE GIF LIBRARY'
        required: false
        type: string

concurrency:
  # Two runs would import the same GIFs twice for nothing.
  group: migrate-gif-library
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: mention
  CLUSTER: oxy-cluster
  SERVICE: mention
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.triggering_actor == github.actor
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      # First, before the checkout and before any credential is requested.
      - name: Authorize the dispatcher
        env:
          OPERATORS: ${{ vars.GIF_LIBRARY_MIGRATION_OPERATORS }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OPERATORS_NORM="${OPERATORS//[[:space:]]/}"
          if [[ -z "$OPERATORS_NORM" ]]; then
            echo "::error::The repository variable GIF_LIBRARY_MIGRATION_OPERATORS is unset or empty, so this workflow authorizes nobody. A repository admin sets it to a comma-separated list of GitHub logins."
            exit 1
          fi
          if [[ ",${OPERATORS_NORM}," != *",${ACTOR},"* ]]; then
            echo "::error::${ACTOR} is not listed in GIF_LIBRARY_MIGRATION_OPERATORS."
            exit 1
          fi
          echo "authorized dispatcher: ${ACTOR}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Production builds only what the owner reviewed: the Dockerfile, context,
      # target and both .dockerignore files must match the ONE pin in
      # .github/scripts/reviewed-images.json, or nothing is built or pushed.
      # The build takes its Dockerfile, context and labels from these outputs.
      # CI runs the same check on every pull request and merge group
      # (`reviewed-image.py check`, ci.yml job "Build, lint and typecheck").
      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe mention

      - name: Build and push the backfill image (its own tag; never `latest`)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}:migrate-giflibrary-${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          provenance: true
          sbom: true
          labels: |-
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.oxy.source.tree=${{ steps.reviewed.outputs.source_tree }}
            io.oxy.build-inputs.sha256=${{ steps.reviewed.outputs.build_inputs_sha256 }}

      - name: Audit final backfill runtime image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types,@oxy.so/mention-contracts'
          EXPECTED_RUNTIME_COMMANDS: 'bun,busybox'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Re-verify current main before the production one-shot
        run: bash .github/scripts/require-current-main.sh

      - name: Run the backfill as an ECS one-shot task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
        run: |
          set -euo pipefail
          MAX_WAIT_SECS=3600
          POLL_INTERVAL=15
          BACKFILL_TASK_DEF=""
          TASK_ARN=""
          TASK_STOPPED=true

          cleanup() {
            local exit_status=$?
            trap - EXIT
            if [[ "$TASK_STOPPED" != "true" && -n "$TASK_ARN" ]]; then
              echo "::warning::Backfill task $TASK_ARN may still be running; the deploy role cannot call ecs:StopTask. Verify it in ECS."
            fi
            if [[ -n "$BACKFILL_TASK_DEF" ]]; then
              aws ecs deregister-task-definition \
                --task-definition "$BACKFILL_TASK_DEF" \
                >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          # Parsed POSITIVELY, and an unrecognised value stops the run. "anything
          # that is not 'true' means write" is the inversion this must not
          # contain: an input arriving empty or mangled would become a live run
          # nobody asked for.
          case "$DRY_RUN" in
            true)  APPLY="false" ;;
            false) APPLY="true" ;;
            *) echo "::error::dry_run must be exactly true or false (got '$DRY_RUN')."; exit 1 ;;
          esac

          if [[ "$APPLY" == "true" && "$CONFIRM_WRITE" != "MOVE GIF LIBRARY" ]]; then
            echo "::error::A write run requires the exact confirmation phrase."
            exit 1
          fi

          echo "mode: apply=$APPLY"

          # Take the task definition and network config from the LIVE service, so
          # the one-shot runs with the same secrets, roles, subnets and security
          # groups the backend already runs with. Nothing is hardcoded, and
          # nothing drifts when the service is redeployed.
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [[ "$(jq -r '.status // "NONE"' <<<"$SERVICE_JSON")" != "ACTIVE" ]]; then
            echo "::error::The production ECS service is not active."
            exit 1
          fi

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot even
          # pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          # A throwaway revision that differs from the live one ONLY by the image.
          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > backfill-taskdef.json

          BACKFILL_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://backfill-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "backfill task definition: $BACKFILL_TASK_DEF"

          # The container is bounded by busybox `timeout` at 3300s, inside the
          # 3600s wait above, so a sweep that outlives its window is stopped by
          # the container rather than left running by a workflow that cannot call
          # `ecs:StopTask`. Every write it committed stands, and the candidate
          # query no longer matches those rows.
          #
          # `--dry-run` is passed only on a preview, and `CONFIRM_ADMIN_MUTATION`
          # only on a confirmed write: withheld, an `APPLY` that somehow reached
          # the container as "true" is refused by the script rather than executed.
          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg apply "$APPLY" \
            '{containerOverrides:[{
               name: $name,
               command: ["busybox","timeout","-s","TERM","-k","30","3300",
                         "bun","packages/backend/dist/src/scripts/migrateGifLibraryToApplicationFiles.js"],
               environment: (
                 if $apply == "true"
                 then [{name:"DRY_RUN", value:"false"},
                       {name:"CONFIRM_ADMIN_MUTATION", value:"migrateGifLibraryToApplicationFiles"}]
                 else [{name:"DRY_RUN", value:"true"}] end
               )
             }]}')
          RUN_TASK_JSON=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$BACKFILL_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
            --overrides "$OVERRIDES" \
            --started-by "gh-migrate-giflibrary")

          if [[ "$(jq '.failures | length' <<<"$RUN_TASK_JSON")" != "0" ]]; then
            echo "::error::ECS refused to start the backfill task."
            jq '.failures' <<<"$RUN_TASK_JSON"
            exit 1
          fi
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_TASK_JSON")
          if [[ -z "$TASK_ARN" ]]; then
            echo "::error::ECS returned no backfill task ARN."
            exit 1
          fi
          TASK_STOPPED=false

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          ELAPSED=0
          while (( ELAPSED < MAX_WAIT_SECS )); do
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "($ELAPSED s) backfill task status=$LAST_STATUS"
            if [[ "$LAST_STATUS" == "STOPPED" ]]; then
              TASK_STOPPED=true
              break
            fi
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ "$TASK_STOPPED" != "true" ]]; then
            echo "::error::Backfill exceeded ${MAX_WAIT_SECS}s. The deploy role cannot call ecs:StopTask; task $TASK_ARN may still be running and must be checked in ECS."
            exit 1
          fi

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── backfill output ────────"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "─────────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # The verdict comes from the exit code, NOT from grepping the log:
          # retrieval above is best-effort, so an unavailable log stream would
          # otherwise read as the comfortable answer. A container killed by its
          # own `timeout` reports 143 (SIGTERM) — that is a partial sweep whose
          # writes are committed, not a failure, and it is reported as such so a
          # re-run is the obvious next step rather than an investigation.
          case "$EXIT_CODE" in
            0)
              echo "::notice::GIF library migration COMPLETE."
              {
                echo "### GIF library migration: COMPLETE"
                echo ""
                echo "Mode: \`apply=$APPLY\`. The \`[migrateGifLibraryToApplicationFiles] complete\` line in the output above carries every count."
                echo ""
                echo "On a dry run, \`gifsSeen\` and \`postMediaToRewrite\` are the size of the move — nothing was written."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            143)
              echo "::warning::GIF library migration PARTIAL — the container hit its time bound. Every GIF it moved stands; re-run to finish."
              {
                echo "### GIF library migration: PARTIAL (hit the time bound)"
                echo ""
                echo "Every moved GIF stands and a re-run skips them, so re-running finishes the move."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::GIF library migration FAILED (exit code $EXIT_CODE, reason: $REASON)."
              {
                echo "### GIF library migration: FAILED"
                echo ""
                echo "Exit code \`$EXIT_CODE\`. Read the output above; moved GIFs stand and failed ones are retried by the next run."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
