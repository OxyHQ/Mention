name: Deploy Mention Backend to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-mention-backend
  # Serialize production rollouts. Cancelling after `update-service` would leave
  # an unmonitored deployment running in ECS.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: '237343248947'
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mention
  CONTAINER_NAME: mention
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/backend` marker to the
          # candidate, so this job needs the marker tags and the history that
          # connects them to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Detect backend deployment scope
        id: filter
        run: bash .github/scripts/deployment-scope.sh backend

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    # Includes image build, migrations, rollout, smoke checks and a full
    # rollback window if the production smoke check fails.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push immutable backend image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          cache-to: type=gha,mode=max,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final backend runtime image
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      - name: Sync GitHub secrets to SSM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          INTERNAL_METRICS_TOKEN: ${{ secrets.INTERNAL_METRICS_TOKEN }}
          KLIPY_APP_KEY: ${{ secrets.KLIPY_APP_KEY }}
          MENTION_DID: ${{ secrets.MENTION_DID }}
          MENTION_MCP_JWT_SECRET: ${{ secrets.MENTION_MCP_JWT_SECRET }}
          MENTION_OXY_CLIENT_ID: ${{ secrets.MENTION_OXY_CLIENT_ID }}
          MENTION_PRIVATE_KEY: ${{ secrets.MENTION_PRIVATE_KEY }}
          MENTION_PUBLIC_KEY: ${{ secrets.MENTION_PUBLIC_KEY }}
          # The SAME GitHub secret `deploy-frontends.yml` uploads to the shell
          # Worker. One value, two custodians: here it reaches the backend through
          # SSM, there it reaches the Worker through `wrangler deploy
          # --secrets-file`. Rotating it means running both workflows.
          MENTION_SHELL_ACCESS_KEY: ${{ secrets.MENTION_SHELL_ACCESS_KEY }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_URI: ${{ secrets.REDIS_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # The allowlist below is the whole set. A name absent from it is never
          # written: the sync loop only ever calls `put-parameter --overwrite`,
          # so dropping a name does not delete anything — it leaves any existing
          # parameter of that name in place, frozen at its last synced value.
          # A frozen parameter is invisible until something reads it and gets a
          # stale answer, so retiring a secret means dropping it from here AND
          # deciding separately whether the parameter itself goes. That second
          # decision is irreversible and belongs to whoever owns SSM.
          SSM_SECRET_ALLOWLIST: >-
            DATABASE_URL FIREBASE_SERVICE_ACCOUNT_BASE64 FIREBASE_PROJECT_ID
            INTERNAL_METRICS_TOKEN KLIPY_APP_KEY MENTION_OXY_CLIENT_ID
            MENTION_DID MENTION_PRIVATE_KEY MENTION_PUBLIC_KEY
            MENTION_SHELL_ACCESS_KEY
            REDIS_URL REDIS_URI
            REDIS_HOST REDIS_PASSWORD
        run: |
          set -euo pipefail
          if [[ -z "$MENTION_MCP_JWT_SECRET" || "$MENTION_MCP_JWT_SECRET" == "-" ]]; then
            echo "::error::MENTION_MCP_JWT_SECRET is empty; refusing to rotate only one service."
            exit 1
          fi

          # Running tasks keep their injected value. Update both parameter
          # paths successfully before any task is restarted.
          for path in \
            /oxy/mention/MENTION_MCP_JWT_SECRET \
            /oxy/mention-mcp/MENTION_MCP_JWT_SECRET; do
            aws ssm put-parameter \
              --name "$path" \
              --value "$MENTION_MCP_JWT_SECRET" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced $path"
          done

          SHARED="REDIS_URL"
          for key in $SSM_SECRET_ALLOWLIST; do
            value="${!key:-}"
            [[ -z "$key" ]] && continue
            if [[ -z "$value" || "$value" == "-" ]]; then
              echo "::warning::Skipping empty or placeholder secret $key; SSM unchanged."
              continue
            fi
            if [[ "$key" == "REDIS_URL" ]] &&
               [[ "$AWS_REGION" == "us-west-2" ]] &&
               [[ "$value" != *".usw2.cache.amazonaws.com"* ]]; then
              echo "::warning::Skipping REDIS_URL because it is not the us-west-2 Valkey endpoint."
              continue
            fi
            if [[ " $SHARED " == *" $key "* ]]; then
              path="/oxy/_shared/$key"
            else
              path="/oxy/$APP/$key"
            fi
            aws ssm put-parameter \
              --name "$path" \
              --value "$value" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced $path"
          done

      - name: Re-verify current main before ECS rollout
        run: bash .github/scripts/require-current-main.sh

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          RUN_MIGRATIONS: 'true'
          INTERNAL_METRICS_PARAMETER: /oxy/mention/INTERNAL_METRICS_TOKEN
          # Normally EMPTY, and empty is the safe value: the deploy then refuses
          # a service scaled to zero, which is what a lost-capacity incident
          # looks like.
          #
          # Set to `mention:<YYYY-MM-DD>` only for a planned window where traffic
          # is deliberately held at zero — a store migration is the case it was
          # written for, and the last one is done. Set it in the same step that
          # scales to 0 and unset it in the step that scales back up, so its
          # lifetime is the window's.
          #
          # It is inert on its own: `deploy-ecs-image.sh` only consults it when
          # `desiredCount` is already 0, which takes a deliberate scale-down. A
          # variable left set cannot authorise anything by itself — and the
          # expiry means a forgotten one disarms itself the day after, rather
          # than leaving this repo permanently easier to deploy onto nothing.
          ALLOW_ZERO_DESIRED_COUNT: ${{ vars.ALLOW_ZERO_DESIRED_COUNT }}
          # The task definition this deploy registers is derived from the LIVE one,
          # not from Terraform — `terraform-uswest2` is many revisions behind and
          # its `image` is `:latest`, so applying it would replace the
          # digest-pinned image this pipeline runs. Anything that must reach
          # production therefore goes HERE as well as in the Terraform record.
          #
          # DATABASE_URL: the backend opens Postgres at boot and refuses to come
          # up without it, so a missing parameter surfaces as
          # `ResourceInitializationError: unable to pull secrets` before any task
          # runs.
          #
          # MENTION_SHELL_ACCESS_KEY: the shell Worker serves nothing without it,
          # so a task that lacks it answers every apex web request with the empty
          # 502 shell. `config/index.ts` refuses to boot without it in production
          # rather than start into that state, which means a missing parameter
          # surfaces as a failed rollout the circuit breaker reverts.
          #
          # CROWDSOURCE_WEBHOOK_SECRET: the signing secret CrowdSource issues per
          # endpoint, and the ONLY secret the moderation integration still has —
          # Mention holds no CrowdSource credential, it presents its Oxy service
          # token. Without this the webhook route is not mounted, and the outbox
          # deliberately holds reports rather than send ones whose decisions
          # could never be verified on the way back.
          TASK_SECRET_OVERRIDES_JSON: >-
            {"MENTION_MCP_JWT_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/MENTION_MCP_JWT_SECRET",
             "DATABASE_URL":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/DATABASE_URL",
             "MENTION_SHELL_ACCESS_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/MENTION_SHELL_ACCESS_KEY",
             "CROWDSOURCE_WEBHOOK_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/CROWDSOURCE_WEBHOOK_SECRET"}
          # Provider credentials never enter this task. Mention selects its
          # reviewed profile by exact opaque primary key; Oxy resolves and signs
          # concrete Kaana routes. Slugs, display names and row order are not
          # routing inputs.
          #
          # WEB_SHELL_ORIGIN is pinned here rather than left to the default in
          # `config/index.ts`, because this revision is derived from the LIVE task
          # definition: if that definition already carries the old
          # `mention-frontend.pages.dev` value as an env var, the code default
          # never applies and the backend would keep proxying to a Pages project
          # this migration retires. Naming it makes the deploy authoritative.
          #
          # MOVE_APPLICATION_ID is the Oxy application id of Oxy Move, the only
          # caller the `/imports/v1` ingest admits (docs/import.mdx). It is an
          # id, not a secret: the gate is the service token Oxy signs for it.
          TASK_ENV_OVERRIDES_JSON: >-
            {"OXY_INFERENCE_ROUTING_PROFILE_ID":"01a06477-94f5-74f0-bc25-4c5c13b93ccd",
             "WEB_SHELL_ORIGIN":"https://shell.mention.earth",
             "MOVE_APPLICATION_ID":"4bac8f1baed68fd02d65d592"}
          # A standing absence assertion: every revision is derived from the
          # live one, so merely stopping the GitHub-to-SSM sync would otherwise
          # keep injecting this retired provider credential forever.
          #
          # OXY_SERVICE_API_KEY/SECRET: the condition this removal waited for has
          # been met, and the marker below is what records that rather than
          # asserting it.
          #
          # The first attempt took production down. Mention could attest its task
          # role and did mint a real service token — but the two mint paths did
          # not grant the same AUTHORITY: a credential that NAMED a privileged
          # scope kept it, an attestation never received one. Mention's
          # credential names three. The pair came off at revision 384 (06:04Z)
          # and from 06:22Z the federation worker failed every ~6 minutes with
          # `Missing required scope: federation:write` — 313 of them, plus
          # `signals:write`, against ZERO in the preceding 36 hours. Revision 389
          # put the pair back and they stopped.
          #
          # oxy#1350 fixed that at the root: a BINDING now names its scopes the
          # way a credential does, gated by the same staff check and bounded by
          # the same ceiling (the application's own grants). `oxy-mention-task`
          # was re-bound with all nine on 2026-09-20 and a token minted BY
          # ATTESTATION from that role was read back, not assumed:
          #
          #   WORKLOAD_OK appName=Mention scopes=["catalogs:write","clarity:index",
          #   "clarity:search","clarity:sites:manage","federation:write",
          #   "files:read","files:write","signals:write","user:read"]
          #
          # Which is the credential's set exactly. So the pair is now a secret
          # nothing reads, and this list is the only thing that takes it off a
          # revision — the render derives from the RUNNING one.
          #
          # workload-scopes-bound: 2026-09-20
          TASK_SECRET_REMOVALS: >-
            ALIA_API_KEY
            OXY_SERVICE_TOKEN
            OXY_SERVICE_API_KEY
            OXY_SERVICE_API_SECRET
          # Variables that now say what the code already decides, and would
          # otherwise ride every future revision forward: the render derives from
          # the RUNNING task definition, so deleting a line here removes nothing.
          #
          # ATPROTO_ENABLED and FEDERATION_MEDIA_CACHE_WRITE_ENABLED are on by
          # default; INTERNAL_METRICS_ENABLED is gone entirely (holding the token
          # is being enabled, and this deploy is what wires the token);
          # OXY_ECOSYSTEM_ACTIVITY_ENABLED is gone too (a deployed process knows
          # it is deployed); POST_CLASSIFICATION_ENABLED was set to the code's own
          # default, which is a line that can only ever drift; and
          # MENTION_FRONTEND_ORIGIN was set to the value the schema already
          # defaults to.
          #
          # A standing list, not a one-off: it is re-applied on every deploy, so a
          # variable somebody re-adds by hand to the live definition does not
          # quietly survive.
          TASK_ENV_REMOVALS: >-
            ATPROTO_ENABLED
            FEDERATION_MEDIA_CACHE_WRITE_ENABLED
            INTERNAL_METRICS_ENABLED
            OXY_ECOSYSTEM_ACTIVITY_ENABLED
            POST_CLASSIFICATION_ENABLED
            MENTION_FRONTEND_ORIGIN
          # DELIBERATELY UNSET, and it must stay that way — this is the variable
          # that used to run `reconcile-engagement-projections.js` after every
          # rollout. `deploy-ecs-image.sh` still supports it; nothing here needs
          # it. Reasons, in the order that matters:
          #
          # 1. IT NEVER FIT, not even with the table empty — AND THE REASON
          #    GENERALISES TO EVERY POST-DEPLOY ONE-SHOT. `deploy-ecs-image.sh`
          #    passes `--task-definition "$new_task_definition"` to `run-task`
          #    (`:593`), and that revision is registered from the LIVE SERVICE's
          #    own definition (`:515`, `:577`) with only `image`, `secrets` and
          #    `environment` rewritten. `cpu` and `memory` are copied verbatim,
          #    and nothing here can override them. So the one-shot runs on the
          #    WEB CONTAINER's sizing — `oxy-mention:211` is 512 CPU / 1024 MiB,
          #    against 8192 CPU / 61440 MiB for the sizing this sweep was timed
          #    on. 16x the CPU. The 12-minute measurement extrapolates to roughly
          #    3 HOURS inside a 20-minute deadline. **Any post-deploy one-shot
          #    doing heavy work inherits a container sized to serve HTTP
          #    requests.** Whatever gets coupled here next hits this too, and it
          #    is invisible from the workflow — the sizing is never named in this
          #    file.
          # 2. A FAILING ONE-SHOT ROLLS THE SERVICE BACK (`:689`). On 2026-08-05
          #    a healthy release that had already reached steady state and passed
          #    its smoke checks was reverted because this sweep did not finish
          #    inside MAX_WAIT_SECS. Release health and maintenance work are
          #    different questions, and only one of them may cancel a deploy.
          # 3. IT IS NOT INCREMENTAL, so the cost is paid in full every time.
          #    Measured against a 624,116-post copy of production's shape: a
          #    second run over already-converged data still processed 300,000
          #    posts in 210s, deleting and reinserting 300,000 rows to produce a
          #    byte-identical result. Converging beforehand shortens it by
          #    nothing — which is also why converging out of band did not rescue
          #    the deploy that this removal follows.
          # 4. THE COST GROWS WITH THE TABLE, so no timeout survives. Work is
          #    O(distinct reply parents), which grows with content — production
          #    was at 156,945 of them, reconciled twice per run. Raising
          #    MAX_WAIT_SECS would not have bought months even before (1); with
          #    it, there was never a value that worked.
          # 5. IT IS A MIGRATION-WINDOW CLOSER, not a release step — its own
          #    docblock says so. It repairs what the writers that predate the
          #    Postgres cutover left wrong: a fixed, historical set. Today's
          #    writers maintain both projections transactionally
          #    (`PostEngagementCommandService`, `recordRecentReplierForPost`) and
          #    the backfill loads both, so on an ordinary deploy it recomputes
          #    correct values into themselves.
          #
          # It now runs BY HAND when there is a reason to — after a restore, or
          # after any window where those writers were not the only ones writing.
          # `packages/backend/scripts/reconcile-engagement-projections.ts` holds
          # the command and how to launch it.
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-mention.sh
        # The existing target group remains on `/`, which server.ts now serves
        # as the same readiness gate as `/health/ready`. ELB mutations belong
        # in oxy-infra because the deploy role intentionally lacks ELB access.
        run: bash .github/scripts/deploy-ecs-image.sh

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the deploy job
    # keeps a read-only token and no AWS job may hold one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed backend revision
        run: bash .github/scripts/record-deployment.sh backend
