name: Deploy Mention Backend to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-mention-backend
  # Serialize production rollouts. Cancelling after `update-service` would leave
  # an unmonitored deployment running in ECS.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: '237343248947'
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mention
  CONTAINER_NAME: mention
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/backend` marker to the
          # candidate, so this job needs the marker tags and the history that
          # connects them to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Detect backend deployment scope
        id: filter
        run: bash .github/scripts/deployment-scope.sh backend

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    # Includes image build, migrations, rollout, smoke checks and a full
    # rollback window if the production smoke check fails.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push immutable backend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          cache-to: type=gha,mode=max,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final backend runtime image
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      - name: Sync GitHub secrets to SSM
        env:
          ALIA_API_KEY: ${{ secrets.ALIA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          INTERNAL_METRICS_TOKEN: ${{ secrets.INTERNAL_METRICS_TOKEN }}
          KLIPY_APP_KEY: ${{ secrets.KLIPY_APP_KEY }}
          MENTION_DID: ${{ secrets.MENTION_DID }}
          MENTION_MCP_JWT_SECRET: ${{ secrets.MENTION_MCP_JWT_SECRET }}
          MENTION_OXY_CLIENT_ID: ${{ secrets.MENTION_OXY_CLIENT_ID }}
          MENTION_PRIVATE_KEY: ${{ secrets.MENTION_PRIVATE_KEY }}
          MENTION_PUBLIC_KEY: ${{ secrets.MENTION_PUBLIC_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          OXY_SERVICE_API_KEY: ${{ secrets.OXY_SERVICE_API_KEY }}
          OXY_SERVICE_API_SECRET: ${{ secrets.OXY_SERVICE_API_SECRET }}
          OXY_SERVICE_TOKEN: ${{ secrets.OXY_SERVICE_TOKEN }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_URI: ${{ secrets.REDIS_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SSM_SECRET_ALLOWLIST: >-
            ALIA_API_KEY DATABASE_URL FIREBASE_SERVICE_ACCOUNT_BASE64 FIREBASE_PROJECT_ID
            INTERNAL_METRICS_TOKEN KLIPY_APP_KEY MENTION_OXY_CLIENT_ID
            MENTION_DID MENTION_PRIVATE_KEY MENTION_PUBLIC_KEY MONGODB_URI
            OXY_SERVICE_API_KEY OXY_SERVICE_API_SECRET OXY_SERVICE_TOKEN
            REDIS_URL REDIS_URI
            REDIS_HOST REDIS_PASSWORD
        run: |
          set -euo pipefail
          if [[ -z "$MENTION_MCP_JWT_SECRET" || "$MENTION_MCP_JWT_SECRET" == "-" ]]; then
            echo "::error::MENTION_MCP_JWT_SECRET is empty; refusing to rotate only one service."
            exit 1
          fi

          # Running tasks keep their injected value. Update both parameter
          # paths successfully before any task is restarted.
          for path in \
            /oxy/mention/MENTION_MCP_JWT_SECRET \
            /oxy/mention-mcp/MENTION_MCP_JWT_SECRET; do
            aws ssm put-parameter \
              --name "$path" \
              --value "$MENTION_MCP_JWT_SECRET" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced $path"
          done

          SHARED="REDIS_URL"
          for key in $SSM_SECRET_ALLOWLIST; do
            value="${!key:-}"
            [[ -z "$key" ]] && continue
            if [[ -z "$value" || "$value" == "-" ]]; then
              echo "::warning::Skipping empty or placeholder secret $key; SSM unchanged."
              continue
            fi
            if [[ "$key" == "REDIS_URL" ]] &&
               [[ "$AWS_REGION" == "us-west-2" ]] &&
               [[ "$value" != *".usw2.cache.amazonaws.com"* ]]; then
              echo "::warning::Skipping REDIS_URL because it is not the us-west-2 Valkey endpoint."
              continue
            fi
            if [[ " $SHARED " == *" $key "* ]]; then
              path="/oxy/_shared/$key"
            else
              path="/oxy/$APP/$key"
            fi
            aws ssm put-parameter \
              --name "$path" \
              --value "$value" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced $path"
          done

      - name: Re-verify current main before ECS rollout
        run: bash .github/scripts/require-current-main.sh

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          RUN_MIGRATIONS: 'true'
          INTERNAL_METRICS_PARAMETER: /oxy/mention/INTERNAL_METRICS_TOKEN
          # Normally EMPTY, and empty is the safe value: the deploy then refuses
          # a service scaled to zero, which is what a lost-capacity incident
          # looks like.
          #
          # Set to `mention:<YYYY-MM-DD>` for the Mongo->Postgres cutover ONLY,
          # where traffic
          # is deliberately held at zero for the whole window because the running
          # image is Mongo-backed and bringing it up after the copy would let
          # real writes land in the store being abandoned. The runbook sets it in
          # the same step that scales to 0 and unsets it in the step that scales
          # back up, so its lifetime is the window's.
          #
          # It is inert on its own: `deploy-ecs-image.sh` only consults it when
          # `desiredCount` is already 0, which takes a deliberate scale-down. A
          # variable left set cannot authorise anything by itself — and the
          # expiry means a forgotten one disarms itself the day after, rather
          # than leaving this repo permanently easier to deploy onto nothing.
          ALLOW_ZERO_DESIRED_COUNT: ${{ vars.ALLOW_ZERO_DESIRED_COUNT }}
          # The task definition this deploy registers is derived from the LIVE one,
          # not from Terraform — `terraform-uswest2` is many revisions behind and
          # its `image` is `:latest`, so applying it would replace the
          # digest-pinned image this pipeline runs. Anything that must reach
          # production therefore goes HERE as well as in the Terraform record.
          #
          # DATABASE_URL: the Mongo->Postgres port requires it at boot. Added
          # ahead of the port so the wiring is proven against an image that
          # ignores the variable; a missing parameter would otherwise surface as
          # `ResourceInitializationError: unable to pull secrets` during a cutover.
          TASK_SECRET_OVERRIDES_JSON: >-
            {"MENTION_MCP_JWT_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/MENTION_MCP_JWT_SECRET",
             "DATABASE_URL":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/DATABASE_URL"}
          # DELIBERATELY UNSET, and it must stay that way — this is the variable
          # that used to run `reconcile-engagement-projections.js` after every
          # rollout. `deploy-ecs-image.sh` still supports it; nothing here needs
          # it. Reasons, in the order that matters:
          #
          # 1. A FAILING ONE-SHOT ROLLS THE SERVICE BACK (`:689`). On 2026-08-05
          #    a healthy release that had already reached steady state and passed
          #    its smoke checks was reverted because this sweep did not finish
          #    inside MAX_WAIT_SECS. Release health and maintenance work are
          #    different questions, and only one of them may cancel a deploy.
          # 2. IT IS NOT INCREMENTAL, so the cost is paid in full every time.
          #    Measured against a 624,116-post copy of production's shape: a
          #    second run over already-converged data still processed 300,000
          #    posts in 210s, deleting and reinserting 300,000 rows to produce a
          #    byte-identical result. Converging beforehand shortens it by
          #    nothing.
          # 3. THE COST GROWS WITH THE TABLE, so no timeout survives. Work is
          #    O(distinct reply parents), which grows with content — production
          #    was at 156,945 of them, reconciled twice per run. Raising
          #    MAX_WAIT_SECS buys months, not a fix.
          # 4. IT IS A MIGRATION-WINDOW CLOSER, not a release step — its own
          #    docblock says so. It repairs what the pre-cutover Mongo writers
          #    left wrong: a fixed, historical set. Today's writers maintain both
          #    projections transactionally (`PostEngagementCommandService`,
          #    `recordRecentReplierForPost`) and the backfill loads both, so on
          #    an ordinary deploy it recomputes correct values into themselves.
          #
          # It now runs BY HAND when there is a reason to — after a restore, or
          # after any window where those writers were not the only ones writing.
          # `packages/backend/scripts/reconcile-engagement-projections.ts` holds
          # the command and how to launch it.
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-mention.sh
        # The existing target group remains on `/`, which server.ts now serves
        # as the same readiness gate as `/health/ready`. ELB mutations belong
        # in oxy-infra because the deploy role intentionally lacks ELB access.
        run: bash .github/scripts/deploy-ecs-image.sh

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the deploy job
    # keeps a read-only token and no AWS job may hold one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed backend revision
        run: bash .github/scripts/record-deployment.sh backend
