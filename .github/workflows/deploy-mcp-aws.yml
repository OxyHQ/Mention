name: Deploy Mention MCP to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-mention-mcp
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mention-mcp
  CONTAINER_NAME: mention-mcp
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/mcp/Dockerfile
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/mcp` marker to the candidate,
          # so this job needs the marker tags and the history that connects them
          # to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Detect MCP deployment scope
        id: filter
        run: bash .github/scripts/deployment-scope.sh mcp

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    # Leaves enough time for both the rollout and an automatic rollback.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable MCP image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-mcp
          cache-to: type=gha,mode=max,scope=mention-mcp
          provenance: true
          sbom: true

      - name: Audit final MCP runtime image
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/mcp/dist/server-http.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/mcp,@mention/shared-types'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      - name: Sync MCP signing secret to both services
        env:
          MENTION_MCP_JWT_SECRET: ${{ secrets.MENTION_MCP_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$MENTION_MCP_JWT_SECRET" || "$MENTION_MCP_JWT_SECRET" == "-" ]]; then
            echo "::error::MENTION_MCP_JWT_SECRET is empty; refusing to rotate only one service."
            exit 1
          fi

          # Running tasks keep their injected value. Update both parameter
          # paths successfully before any task is restarted.
          for path in \
            /oxy/mention/MENTION_MCP_JWT_SECRET \
            /oxy/mention-mcp/MENTION_MCP_JWT_SECRET; do
            aws ssm put-parameter \
              --name "$path" \
              --value "$MENTION_MCP_JWT_SECRET" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced $path"
          done

      - name: Re-verify current main before ECS rollout
        run: bash .github/scripts/require-current-main.sh

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-mcp.sh
          POST_DEPLOY_TASK_COMMAND_JSON: '["bun","packages/mcp/dist/register-capability-catalog.js"]'
          # OXY_SERVICE_API_KEY/SECRET are NOT removed here, and naming them was
          # doing two kinds of damage at once.
          #
          # The first is that it never ran. The same two names are in
          # TASK_SECRET_OVERRIDES_JSON below, and `deploy-ecs-image.sh` refuses a
          # name declared in both lists rather than resolving it — the render
          # filters by name and then concatenates the overrides, so the outcome
          # would depend on the order of two operations on SECRETS. Every MCP
          # deploy has died on `OXY_SERVICE_API_KEY is in both
          # TASK_SECRET_OVERRIDES_JSON and TASK_SECRET_REMOVALS`, before the
          # rollout, which is why this service is still serving an image that
          # predates the code tolerating the pair's absence.
          #
          # The second is what would have happened if it HAD run. The MCP task can
          # attest its ECS task role (oxy ADR 0026) and does mint a real service
          # token that way — but not the same authority: the workload mint drops
          # every privileged scope on purpose, and Mention's credential names
          # `catalogs:write`, which is exactly what
          # `POST /capabilities/catalogs/register` requires. That call is
          # POST_DEPLOY_TASK_COMMAND_JSON above. The removal would have broken the
          # deploy's own last step.
          #
          # Not theoretical: the backend's pair came off at task revision 384 and
          # its federation worker failed every ~6 minutes with `Missing required
          # scope: federation:write` until revision 389 put it back. The pair
          # leaves both services when the BINDING can carry those scopes (oxy, in
          # flight) and these roles have been re-bound.
          TASK_SECRET_OVERRIDES_JSON: >-
            {"MENTION_MCP_JWT_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention-mcp/MENTION_MCP_JWT_SECRET","OXY_SERVICE_API_KEY":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/OXY_SERVICE_API_KEY","OXY_SERVICE_API_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention/OXY_SERVICE_API_SECRET"}
        # Session stickiness must be declared in oxy-infra. The deploy role has
        # no ELB mutation permissions, so this workflow cannot safely enable it.
        run: bash .github/scripts/deploy-ecs-image.sh

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the deploy job
    # keeps a read-only token and no AWS job may hold one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed MCP revision
        run: bash .github/scripts/record-deployment.sh mcp
