name: Deploy Mention MCP to AWS

on:
  # Two triggers, one release per commit. `release-provenance.sh` in the `scope`
  # job decides which of them owns a given SHA, and the answer is the same from
  # both sides, so exactly one of them deploys it:
  #
  #   * push to main — a commit that came through the merge queue. The queue
  #     tested this exact SHA in a `merge_group` run of CI and only then
  #     fast-forwarded main to it, so the release verifies THAT run's
  #     `CI complete` (by the GitHub API, for this SHA, fail-closed) and starts
  #     at once instead of waiting ~8-10 minutes for CI on push to re-test the
  #     same tree. Every other push is skipped here, with a notice.
  #
  #   * workflow_run of CI — the path every release used to take, kept as the
  #     fallback for commits that did NOT come through the queue (an admin
  #     bypass, a direct push, the window before the queue is switched on). It
  #     still requires CI on push to have succeeded, exactly as before, and it
  #     skips any SHA the push path already owns.
  #
  # Before the merge-queue ruleset is enabled no commit is ever verified, so
  # the push trigger skips everything and releases behave exactly as they did.
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mention-mcp
  CONTAINER_NAME: mention-mcp
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/mcp/Dockerfile
  # The commit under release: the pushed head on `push`, the tested head on
  # `workflow_run`. Both are commits on main; require-current-main.sh refuses
  # either the moment it stops being main's head.
  DEPLOY_SHA: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}

jobs:
  # Decides, before anything is serialised, whether this run releases anything:
  # which path owns the SHA, whether it is still main's head, and whether it
  # changed anything this target ships. It sits OUTSIDE the release concurrency
  # group on purpose — see the deploy job.
  scope:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `actions: read` to look up the SHA's merge_group CI run and its jobs. Job
    # level, so no other job gains it; this job holds nothing else.
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/mcp` marker to the candidate,
          # so this job needs the marker tags and the history that connects them
          # to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Decide which release path owns this commit
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: bash .github/scripts/release-provenance.sh
      # Checked here as well as in the deploy job, and this one is what keeps
      # the release lane ordered: a run whose SHA main has already left never
      # reaches the concurrency group, so it cannot displace a newer release
      # waiting there (GitHub cancels a PENDING run when another queues behind
      # it). Neutral, not red — the newer head's release carries this commit.
      - name: Skip a commit main has already moved past
        id: current
        if: steps.provenance.outputs.release == 'true'
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh
      - name: Detect MCP deployment scope
        id: filter
        if: steps.current.outputs.current == 'true'
        run: bash .github/scripts/deployment-scope.sh mcp

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    # On THIS job, not the workflow, since the workflow gained a second trigger.
    # Every commit now starts two runs of it (push, then CI's workflow_run ~10
    # minutes later), and one of the two always releases nothing. A
    # workflow-level group would queue the no-op beside real releases, and
    # GitHub cancels a pending run when another queues behind it — so a no-op
    # for an older commit could silently displace a pending release of a newer
    # one. Here only a run that `scope` has already judged current and owned
    # ever enters the lane.
    concurrency:
      group: deploy-mention-mcp
      # Serialize production rollouts. Cancelling after `update-service` would leave
      # an unmonitored deployment running in ECS.
      cancel-in-progress: false
    outputs:
      # 'true' only when the LAST stale-release guard passed, i.e. this job went
      # on to change production. A job that stopped at a stale guard still
      # succeeds (neutral), so success alone must not move the marker.
      released: ${{ steps.current_release.outputs.current }}
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    # Leaves enough time for both the rollout and an automatic rollback.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        id: current_build
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials
        if: steps.current_build.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: steps.current_build.outputs.current == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        if: steps.current_build.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push immutable MCP image
        if: steps.current_build.outputs.current == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-mcp
          cache-to: type=gha,mode=max,scope=mention-mcp
          provenance: true
          sbom: true

      - name: Audit final MCP runtime image
        if: steps.current_build.outputs.current == 'true'
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/mcp/dist/server-http.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/mcp,@mention/shared-types'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Verify current main before production changes
        id: current_changes
        if: steps.current_build.outputs.current == 'true'
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh

      - name: Sync MCP signing secret to both services
        if: steps.current_changes.outputs.current == 'true'
        env:
          MENTION_MCP_JWT_SECRET: ${{ secrets.MENTION_MCP_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$MENTION_MCP_JWT_SECRET" || "$MENTION_MCP_JWT_SECRET" == "-" ]]; then
            echo "::error::MENTION_MCP_JWT_SECRET is empty; refusing to rotate only one service."
            exit 1
          fi

          # Running tasks keep their injected value. Update both parameter
          # paths successfully before any task is restarted.
          for path in \
            /oxy/mention/MENTION_MCP_JWT_SECRET \
            /oxy/mention-mcp/MENTION_MCP_JWT_SECRET; do
            aws ssm put-parameter \
              --name "$path" \
              --value "$MENTION_MCP_JWT_SECRET" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced $path"
          done

      - name: Re-verify current main before ECS rollout
        id: current_release
        if: steps.current_changes.outputs.current == 'true'
        env:
          STALE_RELEASE: skip
        run: bash .github/scripts/require-current-main.sh

      # Keep the running image and rollback targets under the lifecycle-managed
      # `deployed-<sha>` tags. Re-tag by digest so ECR refuses the write unless
      # the manifest still hashes to the image built by this trusted deploy.
      - name: Tag the released image
        if: steps.current_release.outputs.current == 'true'
        run: bash .github/scripts/tag-ecr-image.sh "oxy/$APP" "${{ steps.build.outputs.digest }}" "$DEPLOY_SHA" "deployed-$DEPLOY_SHA"

      - name: Register immutable task definition and deploy
        if: steps.current_release.outputs.current == 'true'
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-mcp.sh
          POST_DEPLOY_TASK_COMMAND_JSON: '["bun","packages/mcp/dist/register-capability-catalog.js"]'
          # OXY_SERVICE_API_KEY/SECRET leave, and the order this took is the
          # whole lesson.
          #
          # They were once named in BOTH this list and the overrides below, which
          # `deploy-ecs-image.sh` refuses rather than resolving — so every MCP
          # deploy died before its rollout for a day, and this service served an
          # image older than the code those deploys carried. #1086 took them out
          # of the removals, deliberately keeping the injection, because removing
          # them then would have cost `catalogs:write` — the scope
          # `POST /capabilities/catalogs/register` requires, which is this
          # workflow's own POST_DEPLOY_TASK_COMMAND_JSON above. The backend
          # learned that the expensive way: its pair came off at task revision
          # 384 and its federation worker failed every ~6 minutes with `Missing
          # required scope: federation:write` until revision 389 put it back.
          #
          # oxy#1350 fixed it at the root — a BINDING names its scopes the way a
          # credential does — and `oxy-mention-mcp-task` was re-bound on
          # 2026-09-20. A token minted BY ATTESTATION from that role was read
          # back rather than assumed:
          #
          #   WORKLOAD_OK appName=Mention scopes=["catalogs:write","clarity:index",
          #   "clarity:search","clarity:sites:manage","federation:write",
          #   "files:read","files:write","signals:write","user:read"]
          #
          # `catalogs:write` included, so the post-deploy catalogue registration
          # keeps working without the pair. The injection goes too: a name in
          # both lists is what broke this workflow in the first place, and the
          # gate in `validate-workflows.mjs` now refuses that combination.
          #
          # workload-scopes-bound: 2026-09-20
          TASK_SECRET_REMOVALS: OXY_SERVICE_API_KEY OXY_SERVICE_API_SECRET
          TASK_SECRET_OVERRIDES_JSON: >-
            {"MENTION_MCP_JWT_SECRET":"arn:aws:ssm:us-west-2:237343248947:parameter/oxy/mention-mcp/MENTION_MCP_JWT_SECRET"}
        # Session stickiness must be declared in oxy-infra. The deploy role has
        # no ELB mutation permissions, so this workflow cannot safely enable it.
        run: bash .github/scripts/deploy-ecs-image.sh

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff — and only when that
    # rollout actually happened. A deploy job that met a stale guard ends green
    # having changed nothing; moving the marker to its SHA would drop every
    # change between production and that SHA out of the next scope diff.
    needs: deploy
    if: needs.deploy.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the deploy job
    # keeps a read-only token and no AWS job may hold one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed MCP revision
        run: bash .github/scripts/record-deployment.sh mcp
