name: CI

on:
  push:
    # No branch-specific entry here, and it should stay that way. A long-lived
    # branch was listed while the Postgres migration trunk existed, because on
    # `pull_request` alone a run builds `refs/pull/N/merge`, which GitHub cannot
    # create while the PR conflicts — so a conflicted branch dispatches NO run at
    # all, which looks exactly like a green one. That branch has merged and been
    # deleted; the escape hatch below covers the same failure mode generally.
    branches: [main]
  pull_request:
    branches: [main]
  # The escape hatch the comment above is missing. A push that dispatches NO run
  # is indistinguishable from one whose run passed, and the three deploy
  # workflows key on `workflow_run` of this one — so a skipped dispatch is a
  # release that silently never happens, with nothing red to notice. Measured on
  # `ea100282`: the only run GitHub recorded for that commit was CodeQL, this
  # workflow never dispatched, and the merge sat undeployed with `main` green.
  # Without this, the only way to recover is to push another commit.
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed candidate SHA (candidate archive mode only)
        required: false
        type: string
      api_recovery_candidate:
        description: Build ONLY the PR1309 API recovery archive; no AWS publication or deployment
        required: false
        default: false
        type: boolean
      candidate_ci_run_id:
        description: Exact completed PR CI run with backend/build/lockfile/bundle gates successful
        required: false
        type: string
      expected_source_tree:
        description: Exact reviewed candidate Git tree SHA (candidate mode only)
        required: false
        type: string
  # The merge queue. A queued pull request is tested as the exact commit main
  # will be fast-forwarded to — main + everything ahead of it in the queue + this
  # change — on a `gh-readonly-queue/main/...` branch, and it merges only once
  # `CI complete` is green there. Two things follow, and both are the point:
  #
  #   * the tree that reaches main has been tested AS that tree. Before, branch
  #     protection ran with strict=false, so a pull request was tested against
  #     whatever main was when it last pushed, and two green PRs could merge
  #     into a red main;
  #   * that SHA needs no second CI before it ships. The deploy workflows
  #     release a queue-merged commit on `push` by verifying this run's
  #     `CI complete` for the exact SHA (.github/scripts/release-provenance.sh),
  #     instead of waiting ~8-10 minutes for CI on push to re-test it.
  #
  # Declared here so the queue has something to run; enabling it is a ruleset
  # change, made separately. Until then no merge_group event ever fires and
  # every path below behaves exactly as before.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# On a pull request a new push genuinely supersedes the old one, so cancelling
# is right. On main it is backwards: three deploy workflows (deploy-aws,
# deploy-frontends, deploy-mcp-aws) trigger on `workflow_run` of this workflow
# and every one of them requires `conclusion == 'success'`, so CI here is not a
# check — it is the release trigger, and a cancelled run is a release that never
# happens. Merges land faster than CI completes, so `cancel-in-progress: true`
# made the repo deploy LESS the busier it got: six of the last eight runs on
# main were cancelled, one after 54 seconds, leaving production 40+ minutes
# behind main.
#
# Gated on the event rather than on `github.ref != 'refs/heads/main'`, and the
# `merge_group` trigger above is why that matters now rather than in theory: a
# merge_group run's ref is `refs/heads/gh-readonly-queue/...`, so the ref test
# would cancel the runs that gate a merge — and a cancelled queue run is a pull
# request kicked out of the queue. The event test fails toward NOT cancelling,
# which costs runner minutes and never a release. Each queue entry has its own
# ref, so its group is its own and nothing in the queue ever cancels another;
# the queue itself abandons a run when it rebuilds a group.
#
# The group deliberately still collapses every main push into one lane. That is
# what bounds the cost: GitHub cancels a previously *pending* run when a new one
# queues, so main holds at most one running plus one pending run rather than a
# thundering herd, and the pending one that survives is always the newest
# commit. Superseded commits are not stranded — deployment-scope.sh diffs
# against the `deployed/<target>` marker tag, not against the previous commit,
# so the next successful release carries the whole backlog.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '24.21.0'
  # The revision this run is judged against — by the per-package scope, the
  # lockfile resolve and the frontend coverage ratchet alike. Each event keeps
  # it in a different half of the payload, and a `merge_group` event has
  # NEITHER of the two the earlier expression read: `github.base_ref` is empty
  # (it is not a pull_request) and so is `github.event.before` (it is not a
  # push). Left unhandled, every consumer took its "no base" path — the scope
  # ran everything (safe, slow), but the lockfile check SKIPPED outright, which
  # would have let a queued lockfile change reach main unverified.
  #
  #   merge_group  -> merge_group.base_sha: the commit the queue built this
  #                   entry on (main, or the entry ahead of it, which must pass
  #                   before this one can merge)
  #   pull_request -> origin/<base_ref>: the tip of the branch it merges into
  #   push         -> event.before: what main pointed at beforehand
  #
  # `&&` binds tighter than `||` in expressions, so each line is one arm.
  CI_BASE_REVISION: >-
    ${{
      github.event_name == 'merge_group' && github.event.merge_group.base_sha ||
      github.base_ref && format('origin/{0}', github.base_ref) ||
      github.event.before
    }}

jobs:
  # Has the full suite already run on this exact tree? On a push to main that
  # came through the merge queue it has: the queue tested THIS SHA in its
  # merge_group run and fast-forwarded main to it only after `CI complete` went
  # green. Re-running every heavy job on push re-tested an identical tree, and
  # this org is on GitHub's free plan — 20 concurrent jobs across ALL repos,
  # with queue waits measured up to ~10 minutes under load (run 36511597363:
  # jobs created at 02:13:40 started between 02:18:42 and 02:23:14). A second
  # full run per merge is paid for in every other repo's queue time.
  #
  # So a queue-verified push runs only what exists solely on main — the bundle
  # baseline that pull requests restore — and `CI complete` accepts the heavy
  # jobs as skipped ONLY when this job says verified. Every other push (admin
  # bypass, direct push, the queue switched off) and every dispatch runs the
  # full suite exactly as before, because this job answers nothing for them.
  #
  # Same predicate the deploy workflows use (merge-queue-verified.sh), so CI
  # and the release path cannot disagree about a commit. Skipped outright on
  # pull_request and merge_group — a skipped job takes no runner slot and no
  # time, so it costs those runs nothing.
  #
  # An unanswerable question means RUN EVERYTHING: the step is
  # continue-on-error, an API failure leaves `verified` unset, and unset is not
  # 'true'. Failing the job instead would fail the run, and a failed CI run on
  # a direct push is a release the fallback path never makes.
  provenance:
    name: Merge-queue provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - name: Did this exact commit pass CI in the merge queue?
        id: verified
        continue-on-error: true
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/merge-queue-verified.sh

  quality:
    name: Build, lint and typecheck
    needs: provenance
    # Every heavy job carries this condition. `!cancelled()` because a
    # dependency on a SKIPPED job (every pull_request and merge_group run)
    # would otherwise skip the dependent too; it runs unless provenance
    # positively answered verified.
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Oxy dependency health
        run: bun run doctor:oxy
      - name: Verify workspace, build, lint and typecheck
        run: bun run check
      # After `check`, which builds shared-types: the Drizzle schema imports it,
      # so a run before that would fail to load and — without the table-count
      # floor in the script — would have reported "no changes" as success.
      - name: Verify schema and migrations agree
        run: bash .github/scripts/check-schema-migration-parity.sh
      - name: Verify CI and deployment safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-ci-scope.sh
          bash .github/scripts/test-require-current-main.sh
          bash .github/scripts/test-release-provenance.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-resolve-queue-image.sh
          bash .github/scripts/test-optional-task-bindings.sh
          bash .github/scripts/test-source-identity-reconciliation.sh
          bash .github/scripts/test-instagram-one-shot.sh
          bash .github/scripts/test-source-identity-recovery.sh
          bash .github/scripts/test-source-identity-stop.sh
          bash .github/scripts/test-source-identity-request.sh
          bash .github/scripts/test-smoke-mcp.sh
          bash .github/scripts/test-smoke-mention.sh
          bash .github/scripts/test-carry-previous-static.sh
          bash .github/scripts/test-check-schema-migration-parity.sh
          bun .github/scripts/test-runtime-image-audit.mjs
          bun run --cwd packages/frontend coverage:policy-selftest
          bun run --cwd packages/frontend web-font-preload:selftest

  # Ported from bluesky-social/social-app 513a188a2 ("Add a GitHub Action
  # verifying lockfile against base", MIT (c) 2023-2026 Bluesky Social PBC).
  #
  # This exists because `bun install --frozen-lockfile`, which every other job
  # here runs, cannot be trusted as the gate: bun 1.3.14 fails that flag
  # non-deterministically on a clean, unmodified HEAD, so a failure proves
  # nothing and gets learned-around. Resolving the base branch's lockfile
  # against this revision's manifests and comparing to the committed file makes
  # "this lockfile came from a clean resolve" a property of the commit instead.
  #
  # Kept as its own job rather than a step in `quality`, because it has to
  # rewrite bun.lock in the workspace to do its work.
  lockfile:
    name: Lockfile resolves cleanly from the base
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 so the base revision's bun.lock is readable from this
      # checkout; `git show <base>:bun.lock` is the whole mechanism.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # A pull request compares against the tip of its base branch. A push to
      # main compares against what main pointed at beforehand, because this repo
      # integrates batches locally and pushes once, so a lockfile change can
      # reach main without ever having been in a pull request. A branch's first
      # push has no before-commit and nothing to compare against.
      #
      # A merge-queue entry compares against the commit the queue built it on
      # (CI_BASE_REVISION above). It MUST resolve: the queue is the last gate
      # before main, and skipping here would be the one path on which a
      # lockfile change reached main without this check.
      - name: Resolve the base revision
        id: base
        env:
          BASE_REVISION: ${{ env.CI_BASE_REVISION }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = merge_group ] || [ "$EVENT_NAME" = pull_request ]; then
            if ! git rev-parse --verify --quiet "$BASE_REVISION^{commit}" >/dev/null; then
              echo "::error::$EVENT_NAME run cannot resolve its base revision '$BASE_REVISION'; refusing to skip the lockfile check."
              exit 1
            fi
            echo "revision=$BASE_REVISION" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_REVISION" ] && git rev-parse --verify --quiet "$BASE_REVISION^{commit}" >/dev/null; then
            echo "revision=$BASE_REVISION" >> "$GITHUB_OUTPUT"
          else
            echo "revision=" >> "$GITHUB_OUTPUT"
            echo "::notice::no base revision to compare bun.lock against; skipping"
          fi
      - name: Verify bun.lock against the base revision
        if: steps.base.outputs.revision != ''
        env:
          BASE_REVISION: ${{ steps.base.outputs.revision }}
        run: bash .github/scripts/verify-lockfile.sh "$BASE_REVISION"

  tests:
    name: Test ${{ matrix.package }}
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # PostgreSQL, the backend's only data store. The suite creates ONE
    # throwaway, fully-migrated database per run against this server
    # (packages/backend/src/db/testDatabase.ts) and drops it afterwards.
    #
    # PostGIS, not plain Postgres: posts.geo and posts.content_geo are generated
    # `geography` columns, so `CREATE EXTENSION postgis` has to succeed before the
    # migration that names the type. Pinned on BOTH versions and identical to
    # docker-compose.postgres.yml, so a developer's database and CI's cannot
    # disagree about what is installed.
    #
    # Declared for every matrix entry, though since the backend moved to its own
    # sharded job below none of these three legs connects to it: a `services:`
    # block cannot be made conditional on a matrix value, and an empty `image` is
    # a hard error. Kept because the frontend and shared-types suites have
    # reached for a database before, and 14s of container start is cheaper than
    # a leg that silently cannot.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: mention
          POSTGRES_PASSWORD: mention
          POSTGRES_DB: mention_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mention -d mention_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The harness creates its own throwaway database on this SERVER; it never
      # writes to `mention_ci` itself.
      TEST_DATABASE_URL: postgres://mention:mention@127.0.0.1:5432/mention_ci

    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun's coverage reporter only accounts for loaded modules and does not
          # expose a branch-threshold gate. Keep these suites complete rather than
          # publishing a misleading shared-types/MCP percentage.
          - package: shared-types
            command: bun run --cwd packages/shared-types test
            coverage: false
          # The backend is NOT here: it is the `backend-test` shards and the
          # merge inside `CI complete` below, because it was this matrix's
          # critical path by a factor of two.
          - package: frontend
            command: bun run --cwd packages/frontend test:coverage -- --coverageDirectory="$RUNNER_TEMP/frontend-coverage"
            coverage: true
          - package: mcp
            command: bun run --cwd packages/mcp test
            coverage: false
    steps:
      # fetch-depth: 0 because the scope diff below needs both ends of the
      # comparison. It used to carry a second, independent reason — a gate that
      # resolved deleted Mongoose models out of git history and refused on a
      # shallow clone rather than pass vacuously — which retired with the models
      # themselves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Gating the STEPS rather than the job, deliberately. A `needs:` on a
      # scope job measured 8s on this repo's deploy workflow and would sit on
      # the critical path of every run, including the ones that skip nothing —
      # while a leg that no-ops in its own runner costs nobody anything.
      # It also keeps every check reporting `success` instead of `skipped`,
      # which is what branch protection wants.
      - name: Decide whether this package's suite must run
        id: scope
        env:
          CI_SCOPE_BASE: ${{ env.CI_BASE_REVISION }}
        run: bash .github/scripts/ci-scope.sh ${{ matrix.package }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node test runtime
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared runtime package
        if: steps.scope.outputs.run == 'true'
        run: bun run build:shared-types
      - name: Run complete package test suite
        if: steps.scope.outputs.run == 'true'
        run: ${{ matrix.command }}
      # The feed row-cost harness (issue #1103): real rows under the real
      # providers, gated on structural budgets — per-row element counts, per-row
      # requests and Query observers, re-renders of unrelated rows, and zero
      # translation requests during a fling. Its timings are recorded, not gated.
      - name: Feed row-cost harness
        if: matrix.package == 'frontend' && steps.scope.outputs.run == 'true'
        run: bun run --cwd packages/frontend test:perf
      # The frontend's critical-path floor and no-regression ratchet. Kept out of
      # `test:coverage` itself because CI appends `--coverageDirectory` to that
      # script, and an appended flag lands on the LAST command of a chain — so
      # `jest && policy` would hand the flag to the policy and instrument nothing.
      #
      # `always()`: jest's own thresholds can fail for a reason the policy would
      # explain — which file, and how to reproduce it — and a step that runs only
      # after a green suite never gets to say so.
      #
      # The base revision is the one the scope step diffs against. It is what
      # stops a pull request lowering the recorded baseline in the same commit
      # that removes the tests; the script REFUSES an unresolvable base rather
      # than skipping, so a shallow clone fails loudly instead of vacuously.
      - name: Enforce the frontend coverage policy
        if: always() && matrix.package == 'frontend' && steps.scope.outputs.run == 'true'
        env:
          COVERAGE_POLICY_BASE: ${{ env.CI_BASE_REVISION }}
        run: bun run --cwd packages/frontend coverage:check -- --coverage-dir "$RUNNER_TEMP/frontend-coverage"
      - name: Upload coverage summary
        if: always() && matrix.coverage && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mention-${{ matrix.package }}-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.package }}-coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  # The backend suite, one shard per runner.
  #
  # It was ONE leg of the matrix above, and the whole critical path of `CI
  # complete`: 397-500s of job (426s of it the suite itself, on run 36509617655)
  # while every other leg finished in 3.5 minutes or less, so every pull request
  # and every release waited on it. Vitest's `--shard=<i>/<n>` partitions the
  # collected file list with no overlap and no omission; each shard gets its own
  # runner, its own Postgres service and its own throwaway database, so shards
  # share nothing but the checkout.
  #
  # Pattern ported from OxyHQ/oxy's `api-test` + `api-coverage` (the Jest
  # version of the same problem): every shard uploads its report, and a single
  # merge — inside `CI complete`, which starts after the shards anyway — judges
  # the WHOLE suite, the coverage floors and the collection gate both, and
  # refuses to judge anything if a shard is missing or extra.
  # Nothing that was enforced over the complete suite is now enforced over a
  # part of it.
  backend-test:
    name: Test backend (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      # Identical to the matrix above and to docker-compose.postgres.yml; see
      # the comment there for why PostGIS and why pinned.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: mention
          POSTGRES_PASSWORD: mention
          POSTGRES_DB: mention_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mention -d mention_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mention:mention@127.0.0.1:5432/mention_ci
    strategy:
      # Every shard runs to the end even when one fails, so a red run names
      # every failing test instead of the first shard's.
      fail-fast: false
      matrix:
        # The shard count is this list's length: the suite step passes
        # `strategy.job-total` to vitest, and `CI complete` requires exactly
        # that many blobs named `blob-<i>-<total>.json` — so a count changed here
        # without the other side is a red merge, never a silently thinner suite.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The same step-level gating as the matrix above, and the same answer on
      # every shard and in the merge job: all three read one base revision.
      - name: Decide whether the backend suite must run
        id: scope
        env:
          CI_SCOPE_BASE: ${{ env.CI_BASE_REVISION }}
        run: bash .github/scripts/ci-scope.sh backend
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node test runtime
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared runtime package
        if: steps.scope.outputs.run == 'true'
        run: bun run build:shared-types
      # `--reporter=default` is restated because naming any reporter REPLACES
      # the default set, and a log with only a blob in it is one nobody can read.
      #
      # The blob carries this shard's test results AND its raw coverage. The
      # shard judges no coverage floor — `vitest.config.ts` drops the thresholds
      # when `--shard` is on the command line, because a third of the suite reads
      # 46.83% against a 69.13% floor with nothing wrong — so the one judgement
      # is the merge below, over all of them.
      - name: Run this shard of the backend suite
        if: steps.scope.outputs.run == 'true'
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: >-
          bun run --cwd packages/backend test:coverage --
          --shard="$SHARD_INDEX/$SHARD_TOTAL"
          --coverage.reportsDirectory="$RUNNER_TEMP/backend-coverage-shard"
          --reporter=default --reporter=blob
          --outputFile.blob="$RUNNER_TEMP/backend-blobs/blob-$SHARD_INDEX-$SHARD_TOTAL.json"
      # `always()`: a shard whose suite failed still hands its blob to the merge,
      # so the merged report names every failing and every dead file. `overwrite`
      # so re-running one shard replaces its own blob from the earlier attempt.
      - name: Upload this shard's blob report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mention-backend-blob-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-blobs/blob-${{ matrix.shard }}-${{ strategy.job-total }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # Populate the baseline from main so every pull request can restore the same
  # trusted report instead of each one rebuilding its own. Job shape ported from
  # bluesky-social/social-app 783dfe2a1 ("Cache main bundle stats for PR checks",
  # MIT (c) 2023-2026 Bluesky Social PBC).
  #
  # This job and frontend-bundle are mutually exclusive on event type, so a main
  # push still gets exactly one export and the absolute budgets stay enforced on
  # both paths.
  frontend-bundle-baseline:
    name: Frontend bundle baseline
    # `workflow_dispatch` rides the push path deliberately. A manual run is a
    # run of `main`, so it should record a baseline exactly as a push does —
    # and `CI complete` requires the bundle to have run on EXACTLY one of the
    # two paths, so leaving a third event matching neither made the required
    # check fail by construction on every dispatch. Measured: baseline=skipped
    # pull-request=skipped on run 31127222964, with every other job green.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth: 0 so the scope diff below has both ends of the comparison.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # The bundle is built from packages/frontend, so it answers to the same
      # scope question the frontend test leg does.
      - name: Decide whether the bundle changed at all
        id: scope
        env:
          CI_SCOPE_BASE: ${{ env.CI_BASE_REVISION }}
        run: bash .github/scripts/ci-scope.sh frontend
      # A hit means this exact commit was already measured by an earlier run of
      # this job, and the cache is only written after the budgets pass, so
      # skipping the rebuild cannot skip a failing gate.
      - name: Restore bundle baseline for this commit
        id: restore_baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mention-bundle-report.json
          key: mention-bundle-baseline-${{ github.sha }}
      # Every commit on main has to remain addressable as a baseline, because
      # that is what frontend-bundle restores against — so a commit that changed
      # nothing the bundle is built from carries the previous commit's
      # measurement forward under its own key rather than being skipped
      # outright. Skipping outright would push the cost onto the next pull
      # request instead of removing it, by sending it down the fallback path
      # that exports the base commit itself.
      #
      # Nothing here widens what the budgets cover: the scope says frontend when
      # anything under packages/frontend or packages/shared-types moved, and its
      # catch-all says frontend for the lockfile, the manifests, tsconfig and
      # patches too. A miss (an evicted entry, a force push, the first run after
      # this landed) falls through to the full export.
      - name: Inherit the previous commit's baseline
        id: inherit_baseline
        if: steps.scope.outputs.run != 'true' && !steps.restore_baseline.outputs.cache-hit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mention-bundle-report.json
          key: mention-bundle-baseline-${{ github.event.before }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node bundle runtime
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared runtime package
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        run: bun run build:shared-types
      - name: Export production web bundle
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        run: bun run --cwd packages/frontend build:analyze
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mention.earth
      - name: Validate static hosting contract
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/frontend/dist
      - name: Enforce bundle budgets
        if: ${{ !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit }}
        run: >-
          bun run --cwd packages/frontend analyze-bundle --
          --ci
          --json "${{ runner.temp }}/mention-bundle-report.json"
          --markdown "${{ runner.temp }}/mention-bundle-summary.md"
      - name: Publish bundle summary
        if: always() && !steps.restore_baseline.outputs.cache-hit && !steps.inherit_baseline.outputs.cache-hit
        run: |
          if [ -f "$RUNNER_TEMP/mention-bundle-summary.md" ]; then
            cat "$RUNNER_TEMP/mention-bundle-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Saves whichever report is on disk — the one just exported, or the one
      # inherited from the previous commit.
      - name: Save bundle baseline for this commit
        if: ${{ !steps.restore_baseline.outputs.cache-hit }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mention-bundle-report.json
          key: mention-bundle-baseline-${{ github.sha }}

  # Runs on a pull request AND on a merge-queue entry. The absolute ceilings in
  # bundle-budgets.json are the hard gate, and the queue entry is the tree that
  # ships, so it is the one they must hold for. It is NOT the baseline job's
  # shape: a cache saved from a `gh-readonly-queue/...` ref is readable by that
  # ref alone, so recording a baseline there would be work nobody can restore.
  frontend-bundle:
    name: Frontend bundle budget
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # fetch-depth: 0 so origin/<base> and its history are present; the fallback
      # baseline build below has to check the base commit out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide whether the bundle changed at all
        id: scope
        env:
          CI_SCOPE_BASE: ${{ env.CI_BASE_REVISION }}
        run: bash .github/scripts/ci-scope.sh frontend
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node bundle runtime
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The tip of the base branch, which is the commit frontend-bundle-baseline
      # keyed its cache on. Deliberately not the pull request's merge base: a
      # stale merge base would compare this build against a baseline nobody on
      # main is running. A queue entry uses the commit the queue built it on,
      # through the same CI_BASE_REVISION every other base reads.
      - name: Resolve baseline commit
        id: baseline_commit
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_REVISION: ${{ env.CI_BASE_REVISION }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --verify "$BASE_REVISION^{commit}")" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # `path` MUST be byte-identical to the one frontend-bundle-baseline SAVES
      # with (`mention-bundle-report.json`). actions/cache hashes the path list
      # into the entry's version, so a restore under any other path misses even
      # when the key matches exactly. It restored under `mention-bundle-baseline.json`
      # until 2026-09-30: every main commit's baseline sat in the cache never read
      # (last_accessed == created on all 24 entries), and every pull request
      # fell through to the ~165-210s rebuild of the base commit below (run
      # 36712766838: "Cache not found" for a key saved ten hours earlier). The
      # next step moves it to the name the comparison reads.
      - name: Restore bundle baseline from the base branch
        id: restore_baseline
        if: steps.scope.outputs.run == 'true'
        # Restore-only prevents PR-scoped fallback builds from creating caches.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mention-bundle-report.json
          key: mention-bundle-baseline-${{ steps.baseline_commit.outputs.sha }}
      # Out of the way of this run's own report, which the budget step writes to
      # `mention-bundle-report.json`.
      - name: Stage the restored baseline
        if: steps.scope.outputs.run == 'true' && steps.restore_baseline.outputs.cache-hit
        run: mv "$RUNNER_TEMP/mention-bundle-report.json" "$RUNNER_TEMP/mention-bundle-baseline.json"
      # Fallback for a cache miss (first run after this job landed, an evicted
      # entry, a base branch that never pushed). `git reset --hard` rather than
      # the upstream `git reset` + `git restore .`: a mixed reset leaves files
      # this branch added on disk as untracked, and the baseline export would
      # then bundle them and understate the delta.
      #
      # Pull requests only. The comparison it feeds is advisory — the absolute
      # ceilings are the only hard gate, and they are enforced below with or
      # without a baseline — and on a queue entry it would put ~208s (measured,
      # run 36509617655) of building someone else's commit on the path to main.
      # A queue entry whose base has no cached baseline is judged on the ceilings
      # alone, which is exactly what a push to main is judged on.
      - name: Build the baseline bundle at the base commit
        if: github.event_name == 'pull_request' && steps.scope.outputs.run == 'true' && !steps.restore_baseline.outputs.cache-hit
        env:
          BASELINE_SHA: ${{ steps.baseline_commit.outputs.sha }}
          HEAD_SHA: ${{ steps.baseline_commit.outputs.head }}
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mention.earth
        run: |
          set -euo pipefail
          git reset --hard "$BASELINE_SHA"
          bun install --frozen-lockfile --ignore-scripts
          bun run build:shared-types
          bun run --cwd packages/frontend build:analyze
          # No --ci: a base branch that already breaches a ceiling is main's
          # problem to fix, not a reason to fail this pull request.
          bun run --cwd packages/frontend analyze-bundle -- \
            --json "$RUNNER_TEMP/mention-bundle-baseline.json"
          git reset --hard "$HEAD_SHA"
          rm -rf packages/frontend/dist
          # This job is the only one that installs TWO dependency graphs into one
          # runner: the base commit's, then this revision's. Bun's hoisted linker
          # is not guaranteed to converge on the second install — taking the SDK
          # 56 -> 57 bump, it left `@expo/cli` resolving the hoisted ws 7 that
          # `@react-native/dev-middleware` pins instead of the ws 8 it depends on
          # for `WebSocketServer`, and the export died inside @expo/cli. The
          # lockfile records the nested copy correctly and a clean install
          # produces it, so drop the baseline's tree rather than install over it.
          rm -rf node_modules packages/*/node_modules
      - name: Install exact dependency graph
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared runtime package
        if: steps.scope.outputs.run == 'true'
        run: bun run build:shared-types
      - name: Export production web bundle
        if: steps.scope.outputs.run == 'true'
        run: bun run --cwd packages/frontend build:analyze
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mention.earth
      - name: Validate static hosting contract
        if: steps.scope.outputs.run == 'true'
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/frontend/dist
      # The comparison is advisory and never fails on its own; the absolute
      # ceilings in bundle-budgets.json remain the only hard gate. `--baseline`
      # is passed only when one is on disk — always, on a pull request (restored
      # or built above); on a queue entry, only on a cache hit.
      - name: Enforce bundle budgets and compare against the baseline
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          baseline=()
          if [ -f "$RUNNER_TEMP/mention-bundle-baseline.json" ]; then
            baseline=(--baseline "$RUNNER_TEMP/mention-bundle-baseline.json")
          fi
          bun run --cwd packages/frontend analyze-bundle -- \
            --ci \
            --json "$RUNNER_TEMP/mention-bundle-report.json" \
            "${baseline[@]}" \
            --markdown "$RUNNER_TEMP/mention-bundle-summary.md"
      # Step summary rather than a pull request comment: this workflow runs on
      # `pull_request` with contents: read, a comment needs pull-requests: write
      # that forks never receive, and `pull_request_target` would run untrusted
      # code with a write token.
      - name: Publish bundle summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/mention-bundle-summary.md" ]; then
            cat "$RUNNER_TEMP/mention-bundle-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload bundle report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mention-frontend-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/mention-bundle-report.json
          if-no-files-found: warn
          retention-days: 14

  # The Playwright browser gate (packages/e2e), run BEFORE a merge rather than
  # only after one.
  #
  # It used to run solely inside deploy-frontends.yml, against the Pages preview
  # of a commit already on main. So a pull request that broke it merged green,
  # and from then on EVERY web deploy failed at the gate until someone landed a
  # fix: a 36-hour stretch in which no frontend change reached production. The
  # gate was right each time; it was just placed where being right could only
  # block releases, never the change that broke them.
  #
  # Same suite, same pinned Playwright and Chromium, same production build env
  # as deploy-frontends.yml, same candidate mechanism: the browser runs at
  # https://mention.earth against the LIVE API, and fixtures.ts answers every
  # same-origin request from the candidate. Only the candidate's HOST differs —
  # the export served locally by `wrangler pages dev` (the wrangler the deploy
  # pins) instead of an uploaded Pages preview, because a pull request, and a
  # fork's above all, gets no Cloudflare credentials. `pages dev` is the Pages
  # runtime itself: it applies the same `_redirects` SPA rewrite and `_headers`
  # the preview does, so a missing chunk answers exactly as it would there.
  #
  # The deploy KEEPS its own run. This one proves the change; that one proves
  # the uploaded artefact, on the host that is about to be promoted.
  #
  # Its own job, in parallel with everything else: measured ~6m cold against
  # the ~5m bundle budget, so it sits beside the critical path, not on it.
  # Scoped to the frontend leg — the suite gates the web build, and its backend
  # is production's, which a pull request's backend change cannot reach.
  # `packages/e2e/*` itself falls through ci-scope.sh's catch-all to every leg.
  e2e:
    name: Browser gate (e2e)
    needs: provenance
    if: ${{ !cancelled() && needs.provenance.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide whether the web build changed at all
        id: scope
        env:
          CI_SCOPE_BASE: ${{ env.CI_BASE_REVISION }}
        run: bash .github/scripts/ci-scope.sh frontend
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up the pinned Node runtime for the browser gate
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared runtime package
        if: steps.scope.outputs.run == 'true'
        run: bun run build:shared-types
      # Byte-for-byte the environment deploy-frontends.yml builds with, so the
      # candidate under test is the one that would be promoted.
      - name: Build frontend
        if: steps.scope.outputs.run == 'true'
        run: bun run build:frontend
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.mention.earth
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
      - name: Validate static hosting contract
        if: steps.scope.outputs.run == 'true'
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/frontend/dist
      - name: Install the Chromium build the browser gate drives
        if: steps.scope.outputs.run == 'true'
        run: bun run --cwd packages/e2e install-browser
      # Readiness is polled on a real request, bounded, and a server that never
      # answers fails this step by name rather than every flow downstream.
      - name: Serve the candidate on the Pages runtime
        if: steps.scope.outputs.run == 'true'
        env:
          WRANGLER_VERSION: '4.130.0'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          nohup bunx "wrangler@$WRANGLER_VERSION" pages dev packages/frontend/dist \
            --ip 127.0.0.1 --port 4110 >"$RUNNER_TEMP/wrangler-pages-dev.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:4110/; then
              echo "Candidate is served at http://127.0.0.1:4110 (after ${attempt}s)."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/wrangler-pages-dev.log"
          echo "::error::wrangler pages dev did not serve the candidate within 90 seconds."
          exit 1
      - name: Gate the candidate build in a real browser
        if: steps.scope.outputs.run == 'true'
        env:
          MENTION_E2E_CANDIDATE_ORIGIN: http://127.0.0.1:4110
        run: bun run --cwd packages/e2e test
      - name: Upload the browser gate report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mention-e2e-report-${{ github.sha }}-${{ github.run_attempt }}
          path: packages/e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # The single check branch protection should require, so that auto-merge — and
  # the merge queue — have something stable to wait on. Requiring the jobs
  # themselves does not work here: frontend-bundle-baseline and frontend-bundle
  # are mutually exclusive on event type, so one of the pair reports `skipped`
  # on every run, and a required check that reports `skipped` never becomes
  # satisfied. It is also the job merge-queue-verified.sh reads: a queue-merged
  # commit ships on push, and skips its second CI, only if THIS job was green in
  # its merge_group run.
  #
  # It also judges the backend suite as ONE suite, from every shard's blob: the
  # coverage floors in vitest.config.ts (global and per-file) and the
  # collection gate. That was a job of its own, and folded in here because on
  # this org's free plan a job is a queue slot, not just a runner: run
  # 36511597363 spent 50s waiting for that job's runner (created 02:24:14,
  # started 02:25:04) to do 24s of work, and this job has to start after the
  # shards anyway. It adds install + merge (~20s) to this job only when the
  # backend suite actually ran. Nothing about the judgement changed: same
  # refusal of a missing or extra shard, same merge, same floors, same gate.
  #
  # `if: always()` so this still runs — and still fails — when something above
  # it failed or was cancelled.
  ci-complete:
    name: CI complete
    needs: [provenance, quality, lockfile, tests, backend-test, e2e, frontend-bundle-baseline, frontend-bundle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Must equal the length of `backend-test`'s shard list.
      BACKEND_SHARDS: 3
    steps:
      # Everything up to the aggregate check is the backend merge, and it runs
      # only when the shards ran. A queue-verified push skipped them, so it
      # skips this too, including the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.backend-test.result != 'skipped'
        with:
          fetch-depth: 0
      # Recomputed here rather than read from the shards' job output, so the
      # decision to require blobs does not depend on a matrix output surviving:
      # same script, same base, same answer the shards got.
      - name: Decide whether the backend suite had to run
        id: scope
        if: needs.backend-test.result != 'skipped'
        env:
          CI_SCOPE_BASE: ${{ env.CI_BASE_REVISION }}
        run: bash .github/scripts/ci-scope.sh backend
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node test runtime
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download every shard's blob report
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mention-backend-blob-*
          path: ${{ runner.temp }}/backend-blobs
          merge-multiple: true
      # The shard count is an explicit input, never inferred from what is on
      # disk: a run that lost a shard's artifact would otherwise merge the rest
      # and judge the floors over a thinner suite. Exactly blob-1..N-of-N, each
      # non-empty, and nothing else. The collection gate below would ALSO catch
      # a missing shard (its files are absent from the report), but it is the
      # second line, not the first.
      - name: Refuse a missing, empty or extra shard
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/backend-blobs"
          expected=()
          for i in $(seq 1 "$BACKEND_SHARDS"); do
            expected+=("blob-$i-$BACKEND_SHARDS.json")
            if [ ! -s "$dir/blob-$i-$BACKEND_SHARDS.json" ]; then
              echo "::error::shard $i/$BACKEND_SHARDS produced no blob report; refusing to judge the suite without it."
              exit 1
            fi
          done
          actual="$(cd "$dir" && ls -1 | sort)"
          wanted="$(printf '%s\n' "${expected[@]}" | sort)"
          if [ "$actual" != "$wanted" ]; then
            echo "::error::blob reports on disk do not match the $BACKEND_SHARDS declared shards:"
            echo "$actual"
            exit 1
          fi
          echo "All $BACKEND_SHARDS shard blobs present."
      # The merged run applies vitest.config.ts's thresholds — global AND every
      # per-file pin — to the merged coverage of all shards: the same numbers an
      # unsharded run measures, judged the same way. It carries no `--shard`, so
      # the config gives it the full thresholds object. Verified before this
      # landed: a merge of all three blobs reproduces the unsharded totals, a
      # merge given `--coverage.thresholds.statements=99` fails, and a merge of
      # two blobs fails both the floors and the collection gate. Needs no
      # database — `--merge-reports` replays results, it runs nothing.
      - name: Merge the shards and enforce the coverage floors
        if: steps.scope.outputs.run == 'true'
        run: >-
          bun run --cwd packages/backend test:coverage --
          --merge-reports="$RUNNER_TEMP/backend-blobs"
          --coverage.reportsDirectory="$RUNNER_TEMP/backend-coverage"
          --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/backend-report.json"
      # A test file that dies before its first `it()` contributes ZERO tests. It
      # has no assertions to fail, so the pass RATIO improves: measured on this
      # repository, 502 files / 5610 collected / 6 failed read as 99.9% passing
      # while 32 files were dead at load and 296 declared tests never ran. Nothing
      # about pass/fail can see that, and the number moves the reassuring way.
      #
      # Run over the MERGED report, so "every test file on disk appears in the
      # report" is asserted against the whole suite rather than one shard's
      # slice of it. `always()` so it still reports when the merge step failed —
      # a load failure fails the suite too, and this is the step that says WHICH
      # files and why the ratio lied.
      - name: Assert the suite collected what it claims to run
        if: always() && steps.scope.outputs.run == 'true'
        run: bun run check:suite-collection "$RUNNER_TEMP/backend-report.json" packages/backend/src
      - name: Upload coverage summary
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mention-backend-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/backend-coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Require every CI job to have passed
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          failures=()

          # Provenance runs on push and nowhere else. On push it must SUCCEED:
          # its step is continue-on-error, so even an unanswerable API call
          # leaves the job green with `verified` unset — anything else means the
          # job itself broke, and its answer cannot be trusted either way.
          provenance="$(jq -r '.provenance.result' <<<"$RESULTS")"
          verified="$(jq -r '.provenance.outputs.verified // ""' <<<"$RESULTS")"
          if [ "$EVENT_NAME" = push ]; then
            [ "$provenance" = success ] || failures+=("provenance did not pass on push: $provenance")
          else
            [ "$provenance" = skipped ] || failures+=("provenance ran on $EVENT_NAME, where it has nothing to answer: $provenance")
            verified=
          fi

          # The heavy jobs. Normally `skipped` here is never legitimate — it
          # means a future edit gated them, and a gate that reads "skipped" as
          # "fine" is how a required check stops checking. `tests` and
          # `backend-test` are matrices: their result is success only when
          # every leg succeeded; a leg whose scope said "nothing changed" still
          # reports success, never skipped.
          #
          # The ONE exception is a push whose exact SHA passed this very job in
          # the merge queue: those jobs already ran, green, on this tree, and
          # were skipped for that reason alone. Then they must be skipped — a
          # job that ran anyway means the gating broke, and is worth a red.
          for job in quality lockfile tests backend-test e2e; do
            result="$(jq -r --arg job "$job" '.[$job].result' <<<"$RESULTS")"
            if [ "$verified" = true ]; then
              [ "$result" = skipped ] || failures+=("$job ran on a queue-verified push: $result")
            elif [ "$result" != success ]; then
              failures+=("$job did not pass: $result")
            fi
          done
          if [ "$verified" = true ]; then
            echo "::notice::${GITHUB_SHA} passed CI complete in the merge queue on this exact tree; the heavy jobs were not re-run."
          fi

          # Exactly one of the bundle pair runs, chosen by event type (baseline on
          # push and dispatch, the budget on pull_request and merge_group). Asserting
          # the pairing rather than tolerating both being skipped is what stops a
          # future `if:` edit retiring the bundle budget on both paths at once.
          baseline="$(jq -r '."frontend-bundle-baseline".result' <<<"$RESULTS")"
          pull_request="$(jq -r '."frontend-bundle".result' <<<"$RESULTS")"
          case "$baseline/$pull_request" in
            success/skipped | skipped/success) ;;
            *)
              failures+=("the bundle budget did not run on exactly one path: baseline=$baseline pull-request=$pull_request")
              ;;
          esac

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi

          echo 'Every CI job passed, or was skipped by the event type it does not apply to.'

  mention-api-recovery-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.api_recovery_candidate == true && github.repository == 'OxyHQ/Mention' && github.ref != 'refs/heads/main' && github.actor == 'NateIsern'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      EXPECTED_SOURCE_TREE: ${{ inputs.expected_source_tree }}
      CANDIDATE_CI_RUN_ID: ${{ inputs.candidate_ci_run_id }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test closed candidate admission
        run: python3 -B .github/scripts/test-candidate-api-image.py
      - name: Guard owner-reviewed candidate and exact CI
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/candidate-api-image.py
      - name: Setup native ARM archive builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build only the API OCI archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: mention-api-recovery-candidate:${{ github.sha }}
          cache-from: type=gha,scope=mention-backend
          outputs: type=oci,dest=${{ steps.guard.outputs.proof_path }}/image.tar
          labels: |-
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/OxyHQ/Mention
            io.oxy.source.tree=${{ steps.guard.outputs.source_tree }}
            io.oxy.dockerfile.sha256=03fd7ec3c3b5d436fd0e1c5d9471850992d3f32d045b849d98b8bfcb8034a2f8
      - name: Preserve archive bytes and build metadata
        env:
          PROOF_PATH: ${{ steps.guard.outputs.proof_path }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path(os.environ['PROOF_PATH'])
          image = directory / 'image.tar'
          digest = hashlib.file_digest(image.open('rb'), 'sha256').hexdigest()
          (directory / 'archive.json').write_text(json.dumps({'archiveSha256': digest, 'size': image.stat().st_size, 'format': 'oci', 'sourceSha': os.environ['GITHUB_SHA']}, indent=2) + '\n')
          (directory / 'build-metadata.json').write_text(json.dumps(json.loads(os.environ['BUILD_METADATA']), indent=2) + '\n')
          PY
      - name: Retain candidate archive for independent root inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mention-api-recovery-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guard.outputs.proof_path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
