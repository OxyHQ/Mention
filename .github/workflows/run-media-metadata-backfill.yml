name: Run media-metadata backfill

# Drives `backfillMediaMetadata` — the repair for media rows that carry no
# intrinsic metadata: `width`, `height`, `duration_sec`, `orientation`,
# `aspect_ratio`, `size_bytes`. Oxy derives those by probing the asset AFTER the
# upload call returns, so a post is created before they exist and an enrichment
# pass fills them in later.
#
# WHY THE BACKLOG EXISTS, and why it is not small. `MediaMetadataService`
# decided which media items were worth asking Oxy about with a Mongo ObjectId
# regex. oxy-api's `files` table moved to Postgres on 2026-07-31 and its ids are
# uuid v7, so from that date the predicate answered "no" for every native
# upload: the enrichment requested nothing, the BullMQ retry saw nothing
# pending, and the rows kept their NULLs. The predicate is fixed, but a fix does
# not repair rows already written — this workflow does.
#
# The user-visible half is the Videos lane. It requires `width > 0 AND
# height > 0` and an orientation match (`utils/feedQueryBuilder.ts`), so an
# un-enriched video is not merely laid out badly there: it is ABSENT from the
# lane entirely.
#
# Shaped like `run-federated-author-backfill.yml` and
# `run-blocked-domain-purge.yml`, for the same two reasons:
#
# 1. IN-VPC, or the script reaches neither the database (a private VPC address)
#    nor the oxy-api service credential it needs to call `/assets/service/by-ids`
#    — both live in the task definition.
# 2. FROM `main` ONLY. The task reuses the live service's runtime role, secrets,
#    subnets and security groups, so accepting an arbitrary ref here would turn a
#    branch workflow into production code execution.
#
# AUTHORIZATION
#   Dispatches are accepted only from an actor named in the repository variable
#   `MEDIA_METADATA_BACKFILL_OPERATORS` (comma-separated). A dedicated variable
#   rather than a shared one, because a variable's NAME is all an admin editing
#   it in the GitHub UI can read: one shared list would make "remove someone from
#   domain purges" silently also remove them here.
#
#   The check is a STEP that FAILS, not a job-level `if:`. An unset variable
#   makes `contains(...)` false and would refuse everyone while reporting a
#   skipped job with no steps and no reason, which reads as an infrastructure
#   fault. Here it produces a red run whose error names the variable.
#
# WHAT IT WRITES. Only the intrinsic-metadata fields, and only from Oxy's own
# answer for that asset id. It never deletes, never touches text, alt text,
# authorship or engagement, and it rewrites a post's content graph only when at
# least one field actually changes.
#
#   dry_run=true (the default) → reads only, and reports how many posts WOULD be
#     updated. This is the run to read first: it is also the measurement of how
#     large the backlog is.
#   dry_run=false → writes, and requires the exact confirmation phrase.
#
# ALWAYS PLAN FIRST, and re-running is cheap. The script is idempotent and holds
# no cursor: a repaired row stops matching the candidate query, so a run killed
# by the container timeout keeps every write it committed and the next run
# resumes over whatever is left rather than redoing the work.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what WOULD change, write nothing'
        required: true
        type: boolean
        default: true
      confirm_write:
        description: 'For a real write, enter: BACKFILL MEDIA METADATA'
        required: false
        type: string

concurrency:
  # Two sweeps would ask Oxy about the same assets twice and race on the
  # delete-then-insert that rewrites a post's media rows.
  group: backfill-media-metadata
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  APP: mention
  CLUSTER: oxy-cluster
  SERVICE: mention
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  backfill:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.triggering_actor == github.actor
    # Same arch as the deployed image — the service runs linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      # First, before the checkout and before any credential is requested.
      - name: Authorize the dispatcher
        env:
          OPERATORS: ${{ vars.MEDIA_METADATA_BACKFILL_OPERATORS }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          OPERATORS_NORM="${OPERATORS//[[:space:]]/}"
          if [[ -z "$OPERATORS_NORM" ]]; then
            echo "::error::The repository variable MEDIA_METADATA_BACKFILL_OPERATORS is unset or empty, so this workflow authorizes nobody. A repository admin sets it to a comma-separated list of GitHub logins."
            exit 1
          fi
          if [[ ",${OPERATORS_NORM}," != *",${ACTOR},"* ]]; then
            echo "::error::${ACTOR} is not listed in MEDIA_METADATA_BACKFILL_OPERATORS."
            exit 1
          fi
          echo "authorized dispatcher: ${ACTOR}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push the backfill image (its own tag; never `latest`)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}:backfill-mediameta-${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=mention-backend
          provenance: true
          sbom: true

      - name: Audit final backfill runtime image
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          EXPECTED_WORKSPACE_PACKAGES: '@mention/backend,@mention/shared-types'
          EXPECTED_RUNTIME_COMMANDS: 'bun,busybox'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Re-verify current main before the production one-shot
        run: bash .github/scripts/require-current-main.sh

      - name: Run the backfill as an ECS one-shot task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
        run: |
          set -euo pipefail
          MAX_WAIT_SECS=3600
          POLL_INTERVAL=15
          BACKFILL_TASK_DEF=""
          TASK_ARN=""
          TASK_STOPPED=true

          cleanup() {
            local exit_status=$?
            trap - EXIT
            if [[ "$TASK_STOPPED" != "true" && -n "$TASK_ARN" ]]; then
              echo "::warning::Backfill task $TASK_ARN may still be running; the deploy role cannot call ecs:StopTask. Verify it in ECS."
            fi
            if [[ -n "$BACKFILL_TASK_DEF" ]]; then
              aws ecs deregister-task-definition \
                --task-definition "$BACKFILL_TASK_DEF" \
                >/dev/null 2>&1 || true
            fi
            exit "$exit_status"
          }
          trap cleanup EXIT

          # Parsed POSITIVELY, and an unrecognised value stops the run. "anything
          # that is not 'true' means write" is the inversion this must not
          # contain: an input arriving empty or mangled would become a live run
          # nobody asked for.
          case "$DRY_RUN" in
            true)  APPLY="false" ;;
            false) APPLY="true" ;;
            *) echo "::error::dry_run must be exactly true or false (got '$DRY_RUN')."; exit 1 ;;
          esac

          if [[ "$APPLY" == "true" && "$CONFIRM_WRITE" != "BACKFILL MEDIA METADATA" ]]; then
            echo "::error::A write run requires the exact confirmation phrase."
            exit 1
          fi

          echo "mode: apply=$APPLY"

          # Take the task definition and network config from the LIVE service, so
          # the one-shot runs with the same secrets, roles, subnets and security
          # groups the backend already runs with. Nothing is hardcoded, and
          # nothing drifts when the service is redeployed.
          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0]' --output json)
          if [[ "$(jq -r '.status // "NONE"' <<<"$SERVICE_JSON")" != "ACTIVE" ]]; then
            echo "::error::The production ECS service is not active."
            exit 1
          fi

          LIVE_TASK_DEF=$(echo "$SERVICE_JSON" | jq -r '.taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SEC_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          # Mirror the service's public-IP setting: the cluster's subnets are
          # public with NO NAT gateway, so a task without a public IP cannot even
          # pull its image from ECR.
          ASSIGN_IP=$(echo "$SERVICE_JSON" | jq -r '.networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "live task definition: $LIVE_TASK_DEF"

          # A throwaway revision that differs from the live one ONLY by the image.
          aws ecs describe-task-definition --task-definition "$LIVE_TASK_DEF" \
            --query 'taskDefinition' --output json > live-taskdef.json

          CONTAINER=$(jq -r '.containerDefinitions[0].name' live-taskdef.json)

          jq --arg img "$IMAGE" '
            .containerDefinitions[0].image = $img
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' live-taskdef.json > backfill-taskdef.json

          BACKFILL_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://backfill-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          echo "backfill task definition: $BACKFILL_TASK_DEF"

          # The container is bounded by busybox `timeout` at 3300s, inside the
          # 3600s wait above, so a sweep that outlives its window is stopped by
          # the container rather than left running by a workflow that cannot call
          # `ecs:StopTask`. Every write it committed stands, and the candidate
          # query no longer matches those rows.
          #
          # `--dry-run` is passed only on a preview, and `CONFIRM_ADMIN_MUTATION`
          # only on a confirmed write: withheld, an `APPLY` that somehow reached
          # the container as "true" is refused by the script rather than executed.
          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg apply "$APPLY" \
            '{containerOverrides:[{
               name: $name,
               command: (
                 ["busybox","timeout","-s","TERM","-k","30","3300",
                  "bun","packages/backend/dist/src/scripts/backfillMediaMetadata.js"]
                 + (if $apply == "true" then [] else ["--dry-run"] end)
               ),
               environment: (
                 if $apply == "true"
                 then [{name:"CONFIRM_ADMIN_MUTATION", value:"backfillMediaMetadata"}]
                 else [] end
               )
             }]}')

          RUN_TASK_JSON=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$BACKFILL_TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SEC_GROUPS],assignPublicIp=$ASSIGN_IP}" \
            --overrides "$OVERRIDES" \
            --started-by "gh-backfill-mediameta")

          if [[ "$(jq '.failures | length' <<<"$RUN_TASK_JSON")" != "0" ]]; then
            echo "::error::ECS refused to start the backfill task."
            jq '.failures' <<<"$RUN_TASK_JSON"
            exit 1
          fi
          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' <<<"$RUN_TASK_JSON")
          if [[ -z "$TASK_ARN" ]]; then
            echo "::error::ECS returned no backfill task ARN."
            exit 1
          fi
          TASK_STOPPED=false

          echo "task: $TASK_ARN"
          echo "Waiting for the task to stop…"
          ELAPSED=0
          while (( ELAPSED < MAX_WAIT_SECS )); do
            LAST_STATUS=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$TASK_ARN" \
              --query 'tasks[0].lastStatus' \
              --output text)
            echo "($ELAPSED s) backfill task status=$LAST_STATUS"
            if [[ "$LAST_STATUS" == "STOPPED" ]]; then
              TASK_STOPPED=true
              break
            fi
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          if [[ "$TASK_STOPPED" != "true" ]]; then
            echo "::error::Backfill exceeded ${MAX_WAIT_SECS}s. The deploy role cannot call ecs:StopTask; task $TASK_ARN may still be running and must be checked in ECS."
            exit 1
          fi

          TASK_ID="${TASK_ARN##*/}"
          LOG_OPTS=$(jq -r '.containerDefinitions[0].logConfiguration.options' live-taskdef.json)
          LOG_GROUP=$(echo "$LOG_OPTS" | jq -r '."awslogs-group"')
          LOG_PREFIX=$(echo "$LOG_OPTS" | jq -r '."awslogs-stream-prefix"')

          echo "──────── backfill output ────────"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_PREFIX/$CONTAINER/$TASK_ID" \
            --start-from-head \
            --query 'events[].message' --output text || echo "(no logs retrieved)"
          echo "─────────────────────────────────"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          REASON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].stoppedReason' --output text)

          echo "exit code: $EXIT_CODE  (stopped reason: $REASON)"

          # The verdict comes from the exit code, NOT from grepping the log:
          # retrieval above is best-effort, so an unavailable log stream would
          # otherwise read as the comfortable answer. A container killed by its
          # own `timeout` reports 143 (SIGTERM) — that is a partial sweep whose
          # writes are committed, not a failure, and it is reported as such so a
          # re-run is the obvious next step rather than an investigation.
          case "$EXIT_CODE" in
            0)
              echo "::notice::Backfill COMPLETE — the sweep reached the end of the candidate set."
              {
                echo "### Media-metadata backfill: COMPLETE"
                echo ""
                echo "Mode: \`apply=$APPLY\`. The \`[backfillMediaMetadata] complete\` line in the output above carries \`scanned\`, \`updated\` and \`skipped\`."
                echo ""
                echo "On a dry run, \`updated\` IS the size of the backlog — nothing was written."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            75)
              # EXIT_INCOMPLETE in backfillMediaMetadata.ts.
              echo "::warning::Backfill FINISHED with posts unresolved — every write it made is committed. Re-run to retry the rest."
              {
                echo "### Media-metadata backfill: FINISHED, SOME UNRESOLVED"
                echo ""
                echo "This is **not** a failure. The sweep reached the end of the candidate set; some posts"
                echo "could not be resolved this pass, which in practice means Oxy answered 429 to their asset"
                echo "lookups after the bounded retries. Those posts never left the candidate set, so a re-run"
                echo "costs one pass over what is left."
                echo ""
                echo "The \`unresolved\` count is on the \`[backfillMediaMetadata] complete\` line above."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            143)
              echo "::warning::Backfill was stopped at its 3300s bound with candidates remaining — every write it made is committed. Re-run to continue."
              {
                echo "### Media-metadata backfill: PARTIAL (hit the time bound)"
                echo ""
                echo "This is **not** a failure. The container's own \`timeout\` stopped the sweep at 3300s;"
                echo "every write it made is committed, and repaired rows no longer match the candidate query,"
                echo "so a re-run resumes over what is left rather than redoing the work."
                echo ""
                echo "The summary line never runs on a kill, so read the LAST \`[backfillMediaMetadata] progress\`"
                echo "line in the output above instead — it carries \`scanned\`/\`updated\`/\`skipped\` as of the"
                echo "last completed page."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Backfill task exited with $EXIT_CODE — a real failure, not a partial sweep. Any code other than 0, 75 or 143 (including 'None', meaning the task stopped without reporting one) means the script threw or the task never ran; check ECS."
              {
                echo "### Media-metadata backfill: FAILED"
                echo ""
                echo "Exit code \`$EXIT_CODE\`. Stopped reason: \`$REASON\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
