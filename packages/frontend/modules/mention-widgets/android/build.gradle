  // `so.oxy.session.OxyBackgroundSession` — how the FOLLOWING widget authenticates.
  //
  // A widget worker runs with no JS runtime, so it cannot reach the app's session at
  // all; the SDK provisions a purpose-built background credential while the app runs
  // and this is the Kotlin that exchanges it for a short access token. It is the
  // ecosystem's one background-auth path and belongs in the shared SDK, not here — so
  // this module depends on it rather than reimplementing a token lane.
  //
  // A HARD project dependency, not a guarded one: the following widget cannot work
  // without it, and a `findProject` guard would only turn a missing dependency into a
  // compile error further from its cause. `oxyhq-services` is the gradle project name
  // expo-modules-autolinking gives `@oxyhq/services`, which Mention always has.
  implementation project(':oxyhq-services')

